<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LAPA MD Portal</title>

  <!-- Bulma and Custom Premium Stylesheet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest_timekeeper.json">

  <!-- PDF.js dependency -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>




  <!-- iOS PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LAPA MD">
  <meta name="theme-color" content="#3273dc">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="snoozle.png">
  <link rel="icon" type="image/png" sizes="192x192" href="snoozle.png">
  <link rel="apple-touch-icon" sizes="180x180" href="snoozle.png">
</head>

<body>
  <div class="container mt-4">
    <div class="mb-4 is-flex is-justify-content-center">
      <div class="is-size-7 has-text-grey-light">
        Last updated: <span id="timestamp-display">Loading...</span> <span id="version-display"
          style="opacity: 0.65; margin-left: 5px;">(v81)</span>
      </div>
    </div>

    <!-- Date selector for entry page -->
    <div id="date-selector-container" class="mb-5 is-flex is-justify-content-center is-align-items-center"
      style="display: flex; gap: 10px;">
      <label class="label mb-0" for="entry-date-picker"
        style="font-size: 0.95rem; font-weight: 700; color: var(--text-main);">Select Date:</label>
      <div class="control">
        <input class="input is-small" type="date" id="entry-date-picker"
          style="max-width: 160px; font-weight: 600; background-color: #ffffff !important; color: #0f172a !important; color-scheme: light;">
      </div>
      <button class="button is-small is-light" id="btn-force-refresh" onclick="forceRefreshSchedule()"
        title="Force refresh schedule from Google Sheets"
        style="height: 28px; border-radius: 8px; font-size: 0.85rem; padding: 0 10px;">
        🔄 Refresh
      </button>
    </div>


    <!-- Main Content Area -->
    <div id="content" class="entry-page">
      <div class="columns is-multiline">
        <div class="column is-6-desktop is-12-tablet">
          <div class="skeleton-card">
            <div class="skeleton-shimmer skeleton-title"></div>
            <div class="skeleton-shimmer skeleton-subtitle"></div>
            <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 6px 0 12px 0;"></div>
            <div class="skeleton-row">
              <div class="skeleton-shimmer skeleton-badge"></div>
              <div class="skeleton-shimmer skeleton-name"></div>
            </div>
            <div class="skeleton-row">
              <div class="skeleton-shimmer skeleton-badge"></div>
              <div class="skeleton-shimmer skeleton-name"></div>
            </div>
            <div class="skeleton-row" style="border: none;">
              <div class="skeleton-shimmer skeleton-badge"></div>
              <div class="skeleton-shimmer skeleton-name"></div>
            </div>
          </div>
        </div>
        <div class="column is-6-desktop is-12-tablet">
          <div class="skeleton-card">
            <div class="skeleton-shimmer skeleton-title"></div>
            <div class="skeleton-shimmer skeleton-subtitle"></div>
            <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 6px 0 12px 0;"></div>
            <div class="skeleton-row">
              <div class="skeleton-shimmer skeleton-badge"></div>
              <div class="skeleton-shimmer skeleton-name"></div>
            </div>
            <div class="skeleton-row">
              <div class="skeleton-shimmer skeleton-badge"></div>
              <div class="skeleton-shimmer skeleton-name"></div>
            </div>
            <div class="skeleton-row" style="border: none;">
              <div class="skeleton-shimmer skeleton-badge"></div>
              <div class="skeleton-shimmer skeleton-name"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Load Configuration & API Helper first -->
  <script src="config.js"></script>
  <script src="js/api.js"></script>

  <script>
    const currentPage = "entry";
    const IS_READ_ONLY = false;
    // Tracks row IDs that are mid-flight (awaiting API response) so the
    // background poll does not reset their visual state prematurely.
    const pendingRows = new Set();
    const pendingStandbySaves = new Set();

    let viewMode = 'time';
    // Cache the latest data so we can re-render when toggling views
    let cachedData = null;
    let cachedDaysList = [];
    // Cache for all sign-offs to calculate weekly totals
    let allSignOffsList = [];
    // Transfer edit mode: when false, transfer buttons are hidden
    let transferEditMode = false;

    function setTransferEditMode(on) {
      transferEditMode = !!on;
      // Only toggle visibility on un-transferred (pending) buttons
      // Already-transferred (active/red) buttons are always visible
      document.querySelectorAll('.transfer-btn-pending').forEach(btn => {
        btn.style.display = transferEditMode ? 'inline-flex' : 'none';
      });
      // Sync the toggle slider(s) in case multiple days are rendered
      document.querySelectorAll('.transfer-mode-checkbox').forEach(cb => {
        cb.checked = transferEditMode;
      });
    }

    function setViewMode(mode) {
      viewMode = mode;

      // Update tab active classes
      document.querySelectorAll('#view-tabs li').forEach(li => li.classList.remove('is-active'));
      const activeTab = document.getElementById(`tab-${mode}`);
      if (activeTab) activeTab.classList.add('is-active');

      if (cachedDaysList && cachedDaysList.length > 0) render(cachedDaysList);
    }

    function toggleViewMode() {
      if (viewMode === 'time') {
        setViewMode('break');
      } else if (viewMode === 'break') {
        setViewMode('hours');
      } else {
        setViewMode('time');
      }
    }

    function calculateHoursWorked(arrivalStr, departureStr) {
      if (!arrivalStr || !departureStr) return 0;
      try {
        const parseTime = (timeStr) => {
          const [time, ampm] = timeStr.split(' ');
          let [h, m] = time.split(':');
          h = parseInt(h, 10);
          m = parseInt(m, 10);
          if (ampm === 'PM' && h !== 12) h += 12;
          if (ampm === 'AM' && h === 12) h = 0;
          return h * 60 + m; // minutes from midnight
        };
        const arrMin = parseTime(arrivalStr);
        const depMin = parseTime(departureStr);
        if (depMin > arrMin) {
          return (depMin - arrMin) / 60;
        }
      } catch (e) {
        console.error("Error calculating hours:", e);
      }
      return 0;
    }

    function calculateRunningWeeklyHours(employeeName, employeeRole, targetDateStr, allSignOffs) {
      const picker = document.getElementById('entry-date-picker');
      const activeDateVal = picker ? picker.value : ''; // "YYYY-MM-DD"
      const activeYear = activeDateVal ? parseInt(activeDateVal.split('-')[0], 10) : new Date().getFullYear();

      const cleanDateStr = targetDateStr.replace(/^[A-Za-z]+,\s+/, ''); // "May 28"
      const dateParts = cleanDateStr.split(' ');
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const monthIdx = monthNames.indexOf(dateParts[0].substring(0, 3));
      const dayNum = parseInt(dateParts[1], 10);

      const targetDateObj = new Date(activeYear, monthIdx, dayNum);

      const dayOfWeek = targetDateObj.getDay();
      const distToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const monday = new Date(targetDateObj);
      monday.setDate(targetDateObj.getDate() + distToMonday);

      const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const dateStrings = [];

      const tempDate = new Date(monday);
      while (tempDate <= targetDateObj) {
        const formatted = `${weekdays[tempDate.getDay()]}, ${months[tempDate.getMonth()]} ${tempDate.getDate()}`;
        dateStrings.push(formatted);
        tempDate.setDate(tempDate.getDate() + 1);
      }

      const getBaseName = (name) => {
        return String(name || "").replace(/\s*\([^)]*\)/g, '').trim().toLowerCase();
      };

      let totalHours = 0;
      const targetBaseName = getBaseName(employeeName);
      (allSignOffs || []).forEach(s => {
        if (getBaseName(s.name) === targetBaseName &&
          dateStrings.includes(s.dateStr)) {
          totalHours += calculateHoursWorked(s.arrivalTime, s.time);
        }
      });

      return {
        hours: totalHours.toFixed(1),
        rangeLabel: `Mon-${weekdays[targetDateObj.getDay()].substring(0, 3)}`
      };
    }

    function updateLocalCacheSignOff(dateStr, name, role, arrivalTime, departureTime) {
      if (cachedDaysList) {
        const day = cachedDaysList.find(d => d && d.dateStr === dateStr);
        if (day) {
          if (!day.signOffs) day.signOffs = [];

          let signOff = day.signOffs.find(s => String(s.name) === String(name) && String(s.role) === String(role));
          if (!signOff) {
            signOff = {
              dateStr: dateStr,
              name: name,
              role: role,
              arrivalTime: "",
              time: ""
            };
            day.signOffs.push(signOff);
          }

          if (arrivalTime !== undefined) signOff.arrivalTime = arrivalTime;
          if (departureTime !== undefined) signOff.time = departureTime;

          // Remove if both empty
          if (!signOff.arrivalTime && !signOff.time) {
            day.signOffs = day.signOffs.filter(s => !(String(s.name) === String(name) && String(s.role) === String(role)));
          }
        }
        cachedData = cachedDaysList.filter(d => d !== null);
      }

      // Also update allSignOffsList
      let globalSignOff = allSignOffsList.find(s => String(s.name) === String(name) && String(s.role) === String(role) && String(s.dateStr) === String(dateStr));
      if (!globalSignOff) {
        globalSignOff = {
          dateStr: dateStr,
          name: name,
          role: role,
          arrivalTime: "",
          time: ""
        };
        allSignOffsList.push(globalSignOff);
      }
      if (arrivalTime !== undefined) globalSignOff.arrivalTime = arrivalTime;
      if (departureTime !== undefined) globalSignOff.time = departureTime;

      if (!globalSignOff.arrivalTime && !globalSignOff.time) {
        allSignOffsList = allSignOffsList.filter(s => !(String(s.name) === String(name) && String(s.role) === String(role) && String(s.dateStr) === String(dateStr)));
      }
    }

    async function toggleBreakLunch(btn, name, role, dateStr, type) {
      const isChecked = !btn.classList.contains('active');
      btn.classList.add('is-loading');
      try {
        const res = await callApi("toggleBreakLunch", { name, role, dateStr, type, isChecked });
        btn.classList.remove('is-loading');
        if (res && res.success) {
          btn.classList.toggle('active', isChecked);
          showToast("Status updated successfully!", "success");
          if (cachedDaysList) {
            const day = cachedDaysList.find(d => d && d.dateStr === dateStr);
            if (day) {
              if (!day.breakLunchStates) day.breakLunchStates = {};
              const blKey = `${name}|${role}`;
              if (!day.breakLunchStates[blKey]) {
                day.breakLunchStates[blKey] = { break: false, lunch: false };
              }
              day.breakLunchStates[blKey][type] = isChecked;
            }
            cachedData = cachedDaysList.filter(d => d !== null);
          }
        } else {
          showToast("Error: " + (res.error || "failed to update status."));
        }
      } catch (err) {
        btn.classList.remove('is-loading');
        showToast("Action failed: " + err.message);
      }
    }

    window.onload = () => {
      const picker = document.getElementById('entry-date-picker');
      const todayLocal = new Date();
      const yyyy = todayLocal.getFullYear();
      const mm = String(todayLocal.getMonth() + 1).padStart(2, '0');
      const dd = String(todayLocal.getDate()).padStart(2, '0');
      picker.value = `${yyyy}-${mm}-${dd}`;

      picker.onchange = () => {
        fetchFreshData(picker.value);
      };

      fetchFreshData(picker.value);
    };

    // Poll for updates every 30 seconds
    setInterval(pollSignOffs, 30000);

    async function pollSignOffs() {
      try {
        const picker = document.getElementById('entry-date-picker');
        const activeDate = picker ? picker.value : '';
        const update = await callApi("getSnapshotPollUpdate", { dateStr: activeDate });

        allSignOffsList = update.signOffs || [];

        // Update cachedDaysList in memory
        if (cachedDaysList) {
          cachedDaysList.forEach((day, dayIdx) => {
            if (day) {
              day.signOffs = (update.signOffs || []).filter(s => s.dateStr === day.dateStr);
              if (update.breakLunchStatesByDate && update.breakLunchStatesByDate[day.dateStr]) {
                day.breakLunchStates = update.breakLunchStatesByDate[day.dateStr];
              }
              // Sync standby tracker data from poll
              if (update.standbyTracker) {
                day.standbyTracker = update.standbyTracker;
                updateStandbyUI(dayIdx);
              }
            }
          });
          cachedData = cachedDaysList.filter(d => d !== null);
        }

        syncCheckboxes(update.signOffs, update.breakLunchStatesByDate);
      } catch (err) {
        console.error("Polling error:", err);
      }
    }

    function syncCheckboxes(liveSignOffs, breakLunchStatesByDate) {
      const signedOffKeys = new Map(liveSignOffs.map(s => [`${s.name}|${s.role}|${s.dateStr}`, s]));
      const blStatesByDate = breakLunchStatesByDate || {};
      const isEntry = (currentPage === "entry");

      document.querySelectorAll('.entry').forEach(entryRow => {
        const content = entryRow.querySelector('.entry-content');
        if (!content) return;

        // Skip rows that have a pending API call in progress
        if (pendingRows.has(entryRow.id)) return;

        const arrivalCb = entryRow.querySelector('.arrival-checkbox');
        const departureCb = entryRow.querySelector('.departure-checkbox') || entryRow.querySelector('.gone-home-checkbox');

        // In break view mode, time controls may not exist — use row data-* attributes instead
        const name = departureCb ? departureCb.dataset.name : entryRow.dataset.name;
        const role = departureCb ? departureCb.dataset.role : entryRow.dataset.role;
        const dateStr = departureCb ? departureCb.dataset.date : entryRow.dataset.date;
        if (!name || !role || !dateStr) return;
        const key = `${name}|${role}|${dateStr}`;
        const data = signedOffKeys.get(key);

        const arrivalTimeWrapper = entryRow.querySelector('.arrival-time-wrapper');
        const departureTimeWrapper = entryRow.querySelector('.departure-time-wrapper');
        const arrivalTimeInput = arrivalTimeWrapper ? arrivalTimeWrapper.querySelector('input[type="time"]') : null;
        const departureTimeInput = departureTimeWrapper ? departureTimeWrapper.querySelector('input[type="time"]') : null;

        // Clear existing display spans across the whole row
        entryRow.querySelectorAll('.arrival-time-display, .departure-time-display').forEach(el => el.remove());

        // If in hours view mode, we ONLY want to sync the running hours badge and nothing else!
        if (viewMode === 'hours') {
          const hoursDisplay = entryRow.querySelector('.hours-display-wrapper');
          if (hoursDisplay) {
            const res = calculateRunningWeeklyHours(name, role, dateStr, allSignOffsList);
            hoursDisplay.innerHTML = `<span class="tag is-info is-medium" style="font-weight: 700; border-radius: 8px;">📊 ${res.hours} hrs <span style="font-size: 0.75rem; font-weight: 600; margin-left: 4px; opacity: 0.85;">(${res.rangeLabel})</span></span>`;
          }
          if (data && data.time) {
            content.classList.add('strikethrough');
          } else {
            content.classList.remove('strikethrough');
          }
          return;
        }

        // If in break view mode, we ONLY want to sync the break/lunch/OB buttons and nothing else!
        if (viewMode === 'break') {
          const dayState = blStatesByDate[dateStr] || {};
          const blKey = `${name}|${role}`;
          const bl = dayState[blKey] || { break: false, lunch: false, ob: false };
          const blControls = entryRow.querySelector('.break-lunch-controls');
          if (blControls) {
            const btnBreak = blControls.querySelector('.btn-break');
            const btnLunch = blControls.querySelector('.btn-lunch');
            if (btnBreak) btnBreak.classList.toggle('active', !!bl.break);
            if (btnLunch) btnLunch.classList.toggle('active', !!bl.lunch);

            const btnOb = blControls.querySelector('.btn-ob');
            if (btnOb) btnOb.classList.toggle('active', !!bl.ob);
          }
          if (data && data.time) {
            content.classList.add('strikethrough');
          } else {
            content.classList.remove('strikethrough');
          }
          return;
        }

        if (data) {
          // Sync Arrival (Entry Mode Only)
          if (isEntry && arrivalCb) {
            arrivalCb.checked = !!data.arrivalTime;
            const arrivalSwitchContainer = entryRow.querySelector('.arrival-switch');
            if (arrivalSwitchContainer) arrivalSwitchContainer.style.display = data.arrivalTime ? 'none' : 'inline-flex';
            if (arrivalTimeInput) {
              arrivalTimeInput.value = data.arrivalTime ? formatTimeForInput(data.arrivalTime) : '';
              updateTimeDisplay(arrivalTimeInput);
            }
            if (arrivalTimeWrapper) {
              if (data.arrivalTime) {
                arrivalTimeWrapper.classList.add('has-value');
                const triggerBtn = arrivalTimeWrapper.querySelector('.time-trigger-btn');
                if (triggerBtn) triggerBtn.style.display = 'none';

                let span = arrivalTimeWrapper.querySelector('.arrival-time-display');
                if (!span) {
                  span = document.createElement('span');
                  span.className = 'arrival-time-display clickable-time-display';
                  span.title = 'Click to edit time';
                  span.innerHTML = '<span class="time-prefix">IN @ </span>';
                  arrivalTimeWrapper.prepend(span);
                }
                const textNode = span.childNodes[1] || document.createTextNode('');
                textNode.textContent = data.arrivalTime;
                if (!span.childNodes[1]) span.appendChild(textNode);
                span.style.display = '';
              } else {
                arrivalTimeWrapper.classList.remove('has-value');
                const triggerBtn = arrivalTimeWrapper.querySelector('.time-trigger-btn');
                if (triggerBtn) triggerBtn.style.display = 'flex';
                const span = arrivalTimeWrapper.querySelector('.arrival-time-display');
                if (span) span.remove();
              }
            }
          } else if (arrivalCb) {
            arrivalCb.style.display = 'none';
          }

          // Sync Departure
          if (departureCb) departureCb.checked = !!data.time;
          const departureSwitchContainer = departureCb ? departureCb.closest('.switch-container') : null;
          if (departureSwitchContainer) departureSwitchContainer.style.display = data.time ? 'none' : 'inline-flex';
          if (departureTimeInput) {
            departureTimeInput.value = data.time ? formatTimeForInput(data.time) : '';
            updateTimeDisplay(departureTimeInput);
          }
          if (departureTimeWrapper) {
            if (data.time) {
              departureTimeWrapper.classList.add('has-value');
              const triggerBtn = departureTimeWrapper.querySelector('.time-trigger-btn');
              if (triggerBtn) triggerBtn.style.display = 'none';

              let span = departureTimeWrapper.querySelector('.departure-time-display');
              if (!span) {
                span = document.createElement('span');
                span.className = 'departure-time-display clickable-time-display';
                span.title = 'Click to edit time';
                span.innerHTML = '<span class="time-prefix">OUT @ </span>';
                departureTimeWrapper.prepend(span);
              }
              const textNode = span.childNodes[1] || document.createTextNode('');
              textNode.textContent = data.time;
              if (!span.childNodes[1]) span.appendChild(textNode);
              span.style.display = '';
              content.classList.add('strikethrough');
            } else {
              departureTimeWrapper.classList.remove('has-value');
              const triggerBtn = departureTimeWrapper.querySelector('.time-trigger-btn');
              if (triggerBtn) triggerBtn.style.display = 'flex';
              const span = departureTimeWrapper.querySelector('.departure-time-display');
              if (span) span.remove();
              content.classList.remove('strikethrough');
            }
          }
        } else {
          // No sign-off data, ensure everything is unchecked and visible
          if (arrivalCb) arrivalCb.checked = false;
          if (departureCb) departureCb.checked = false;
          content.classList.remove('strikethrough');
          const arrivalSwitchContainer = entryRow.querySelector('.arrival-switch');
          const departureSwitchContainer = departureCb ? departureCb.closest('.switch-container') : null;
          if (arrivalSwitchContainer) arrivalSwitchContainer.style.display = isEntry ? 'inline-flex' : 'none';
          if (departureSwitchContainer) departureSwitchContainer.style.display = 'inline-flex';

          if (arrivalTimeWrapper) {
            arrivalTimeWrapper.classList.remove('has-value');
            const triggerBtn = arrivalTimeWrapper.querySelector('.time-trigger-btn');
            if (triggerBtn) triggerBtn.style.display = isEntry ? 'flex' : 'none';
          }
          if (departureTimeWrapper) {
            departureTimeWrapper.classList.remove('has-value');
            const triggerBtn = departureTimeWrapper.querySelector('.time-trigger-btn');
            if (triggerBtn) triggerBtn.style.display = 'flex';
            if (departureTimeInput) {
              departureTimeInput.value = '';
              updateTimeDisplay(departureTimeInput);
            }
          }
        }

        // Sync break/lunch/ob buttons
        const dayState = blStatesByDate[dateStr] || {};
        const blKey = `${name}|${role}`;
        const bl = dayState[blKey] || { break: false, lunch: false, ob: false };
        const blControls = entryRow.querySelector('.break-lunch-controls');
        if (viewMode === 'break' || role === 'MD Call') {
          if (blControls) {
            const btnBreak = blControls.querySelector('.btn-break');
            const btnLunch = blControls.querySelector('.btn-lunch');
            if (btnBreak) btnBreak.classList.toggle('active', !!bl.break);
            if (btnLunch) btnLunch.classList.toggle('active', !!bl.lunch);

            const btnOb = blControls.querySelector('.btn-ob');
            if (btnOb) btnOb.classList.toggle('active', !!bl.ob);
          }
        }

        // Sync running weekly hours badge if in hours view
        const hoursDisplay = entryRow.querySelector('.hours-display-wrapper');
        if (hoursDisplay) {
          const res = calculateRunningWeeklyHours(name, role, dateStr, allSignOffsList);
          hoursDisplay.innerHTML = `<span class="tag is-info is-medium" style="font-weight: 700; border-radius: 8px;">📊 ${res.hours} hrs <span style="font-size: 0.75rem; font-weight: 600; margin-left: 4px; opacity: 0.85;">(${res.rangeLabel})</span></span>`;
        }
      });
    }

    function renderSkeletonLayout(dates) {
      let html = '<div class="columns is-multiline">';
      dates.forEach((d, idx) => {
        html += `
          <div class="column is-6-desktop is-12-tablet" id="day-card-${idx}">
            <div class="skeleton-card">
              <div class="skeleton-shimmer skeleton-title"></div>
              <div class="skeleton-shimmer skeleton-subtitle"></div>
              <div style="height: 1px; background: rgba(255,255,255,0.08); margin: 6px 0 12px 0;"></div>
              <div class="skeleton-row">
                <div class="skeleton-shimmer skeleton-badge"></div>
                <div class="skeleton-shimmer skeleton-name"></div>
              </div>
              <div class="skeleton-row">
                <div class="skeleton-shimmer skeleton-badge"></div>
                <div class="skeleton-shimmer skeleton-name"></div>
              </div>
              <div class="skeleton-row" style="border: none;">
                <div class="skeleton-shimmer skeleton-badge"></div>
                <div class="skeleton-shimmer skeleton-name"></div>
              </div>
            </div>
          </div>`;
      });
      html += '</div>';
      document.getElementById('content').innerHTML = html;
    }

    async function fetchFreshData(customDate, forceRefresh = false) {
      try {
        const picker = document.getElementById('entry-date-picker');
        const activeDate = customDate || (picker ? picker.value : '');

        const dates = await callApi("getPortalActiveDates", { customDateStr: activeDate });
        renderSkeletonLayout(dates);

        cachedDaysList = new Array(dates.length).fill(null);

        const updatePromise = callApi("getSnapshotPollUpdate", { dateStr: activeDate })
          .then(update => { allSignOffsList = update.signOffs || []; });

        const fetchPromises = dates.map(async (d, idx) => {
          try {
            const dayData = await callApi("getDailySnapshotDataForDate", {
              isoDateStr: d.isoDateStr,
              viewTitle: d.viewTitle,
              viewType: d.viewType,
              isEditable: d.isEditable,
              forceRefresh: forceRefresh
            });

            cachedDaysList[idx] = dayData;
            await updatePromise;

            const cardEl = document.getElementById(`day-card-${idx}`);

      const row = document.getElementById(targetId);

    function updateTimeDisplay(input) {
      if (!input) return;
      const wrapper = input.closest('.time-input-wrapper');

        wrapper.classList.add('has-value');
      } else {
        wrapper.classList.remove('has-value');
      }
    }



    async function handleTimeInputChange(input, type, name, role, dateStr, targetId) {
      updateTimeDisplay(input);
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) {
        // On Android/Desktop, the change event signifies a final commit (user clicked OK/Set).
        // Blurring the input programmatically will trigger handleTimeInputBlur to save.
        input.blur();
        return;
      }
      if (document.activeElement === input) {
        return; // Don't write to sheet while user is spinning wheel/actively focused on input
      }
      const row = document.getElementById(targetId);
      if (!row) return;
      const checkbox = row.querySelector(type === 'arrival' ? '.arrival-checkbox' : '.departure-checkbox');
      if (checkbox) {
        if (input.value === "") {
          checkbox.checked = false;
          if (type === 'arrival') {
            await toggleArrival(checkbox, name, role, dateStr, targetId);
          } else {
            await toggleDeparture(checkbox, name, role, dateStr, targetId);
          }
        } else if (checkbox.checked) {
          if (type === 'arrival') {
            await toggleArrival(checkbox, name, role, dateStr, targetId);
          } else {
            await toggleDeparture(checkbox, name, role, dateStr, targetId);
          }
        }
      }
    }

    function formatAmPmTo24h(timeStr) {
      if (!timeStr) return '';
      const match = timeStr.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
      if (!match) return '';
      let [_, hoursStr, minutesStr, ampm] = match;
      let hours = parseInt(hoursStr, 10);
      ampm = ampm.toUpperCase();
      if (ampm === 'PM' && hours < 12) {
        hours += 12;
      } else if (ampm === 'AM' && hours === 12) {
        hours = 0;
      }
      const hStr = String(hours).padStart(2, '0');
      return `${hStr}:${minutesStr}`;
    }

    async function handleTimeInputBlur(input, type, name, role, dateStr, targetId) {
      const originalValue = input.dataset.originalValue || "";
      const newValue = input.value || "";

      if (newValue === originalValue) {
        return;
      }

      const row = document.getElementById(targetId);
      if (!row) return;

      const checkbox = row.querySelector(type === 'arrival' ? '.arrival-checkbox' : '.departure-checkbox');
      if (!checkbox) return;

      if (newValue === "") {
        if (checkbox.checked) {
          checkbox.checked = false;
          if (type === 'arrival') {
            await toggleArrival(checkbox, name, role, dateStr, targetId);
          } else {
            await toggleDeparture(checkbox, name, role, dateStr, targetId);
          }
        }
      } else {
        checkbox.checked = true;
        if (type === 'arrival') {
          await toggleArrival(checkbox, name, role, dateStr, targetId);
        } else {
          await toggleDeparture(checkbox, name, role, dateStr, targetId);
        }
      }
    }

    function parseDateParts(dateStr) {
      if (!dateStr) return null;
      const str = String(dateStr).trim();
      if (str.includes('-')) {
        const parts = str.split('-');
        if (parts.length < 3) return null;
        return {
          month: parseInt(parts[1], 10),
          day: parseInt(parts[2], 10)
        };
      }
      const parts = str.split('/');
      if (parts.length < 2) return null;
      return {
        month: parseInt(parts[0], 10),
        day: parseInt(parts[1], 10)
      };
    }

    function datesMatch(d1, d2) {
      const p1 = parseDateParts(d1);
      const p2 = parseDateParts(d2);
      if (!p1 || !p2) return false;
      return p1.month === p2.month && p1.day === p2.day;
    }

    function ensureDatesArray(datesField) {
      if (!datesField) return [];
      if (Array.isArray(datesField)) return datesField;
      if (typeof datesField === 'string') {
        return datesField.split(',').map(d => d.trim()).filter(Boolean);
      }
      return [];
    }

    function renderStandbyListForDay(day) {
      const candidates = getStandbyCandidates(day);
      const top3 = candidates.slice(0, 3);
      const isoStr = day.isoDateStr || '';
      const dateId = day.dateStr.replace(/[^a-zA-Z0-9]/g, '');

      const badgeColors = ['var(--accent-emerald)', 'var(--accent-blue)', 'var(--accent-indigo)'];

      if (top3.length === 0) {
        return '<p class="italic-grey py-2" style="padding-left: 10px;">No candidates</p>';
      }

      return top3.map((cand, idx) => {
        const accentColor = badgeColors[idx] || 'var(--accent-indigo)';
        const trackerEntry = (day.standbyTracker || []).find(e => e.name.toLowerCase().split('(')[0].trim() === cand.name.toLowerCase().split('(')[0].trim());
        const datesArray = trackerEntry ? ensureDatesArray(trackerEntry.dates) : [];
        const alreadyAssigned = datesArray.some(d => datesMatch(d, isoStr));
        const baseCandName = cand.name.split('(')[0].trim();
        const rankLabels = ['1st', '2nd', '3rd'];
        const rankLabel = rankLabels[idx] || (idx + 1) + 'th';
        const badgeBg = alreadyAssigned ? accentColor : 'transparent';
        const badgeColor = alreadyAssigned ? '#fff' : accentColor;
        const badgeBorder = accentColor;
        const badgeShadow = alreadyAssigned ? ('0 0 10px ' + accentColor) : 'none';

        const saveKey = `${baseCandName}|${isoStr}`;
        const isSaving = typeof pendingStandbySaves !== 'undefined' && pendingStandbySaves.has(saveKey);
        const pointerEvents = isSaving ? 'none' : 'auto';
        const opacity = isSaving ? '0.6' : '1';

        return `
        <div class="entry" style="min-height: 56px; border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: space-between; padding-right: 8px;">
          <div style="display: flex; align-items: center; min-width: 0; flex-grow: 1;">
            <span
              id="sb-badge-${dateId}-${idx}"
              onclick="toggleStandbyCandidate(this, '${baseCandName}', '${isoStr}', ${alreadyAssigned ? 'true' : 'false'}, '${accentColor}', '${cand.role}')"
              title="${alreadyAssigned ? 'Click to un-assign standby' : 'Click to assign standby'}"
              style="flex-shrink:0; min-width:38px; height:38px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:0.82rem; font-weight:800; cursor:${isSaving ? 'default' : 'pointer'}; transition:all 0.22s;
                background:${badgeBg};
                color:${badgeColor};
                border: 2px solid ${badgeBorder};
                box-shadow:${badgeShadow};
                pointer-events:${pointerEvents};
                opacity:${opacity};
                margin-right:10px;"

    // --- Standby Eligibility Tracker Logic ---
    function getStandbyCandidates(day) {
      if (!day.standbyTracker || day.standbyTracker.length === 0) return [];

      const isoStr = day.isoDateStr || '';
      const dayMD = (() => {
        if (!isoStr) return '';
        const p = isoStr.split('-');
        return parseInt(p[1], 10) + '/' + parseInt(p[2], 10);
      })();

      const trackerMap = new Map();
      day.standbyTracker.forEach(emp => {
        const cleanName = emp.name.split('(')[0].trim().toLowerCase();
        trackerMap.set(cleanName, emp);
      });

      const candidates = [];

      // Helper to check if already assigned standby today
      const checkAssigned = (entry) => {
        return !!(entry && dayMD && entry.dates && entry.dates.some(d => {
          const dp = d.split('/');
          return dp.length >= 2 && parseInt(dp[0],10) + '/' + parseInt(dp[1],10) === dayMD;
        }));
      };

      // Determine max shift number to define bottom half boundary (only for regular shifts < 100)
      const scheduledNums = (day.numbered || [])
        .map(c => parseInt(c.num, 10))
        .filter(n => !isNaN(n) && n < 100);
      const maxShiftNum = scheduledNums.length > 0 ? Math.max(...scheduledNums) : 0;
      const boundary = Math.ceil(maxShiftNum / 2);

      // 1. Process LSC staff
      if (Array.isArray(day.lsc)) {
        day.lsc.forEach(fullName => {
          const baseName = fullName.split('(')[0].trim().toLowerCase();
          const trackerEntry = trackerMap.get(baseName);
          if (trackerEntry) {
            candidates.push({
              name: fullName,
              role: "LSC",
              shiftNum: -1,
              count: trackerEntry.count,
              isLsc: true,
              alreadyAssigned: checkAssigned(trackerEntry)
            });
          }
        });
      }

      // 2. Process numbered shifts
      if (Array.isArray(day.numbered)) {
        day.numbered.forEach(crna => {
          if (crna.num === "MD Locum") return;

          const empName = crna.name;
          const shiftNum = parseInt(crna.num, 10);
          if (isNaN(shiftNum)) return;

          // Skip bottom half shifts (only for regular shifts < 100)
          if (shiftNum < 100 && shiftNum <= boundary) return;

          const cleanEmpName = empName.split('(')[0].trim().toLowerCase();
          const trackerEntry = trackerMap.get(cleanEmpName);
          if (trackerEntry) {
            candidates.push({
              name: empName,
              role: crna.num,
              shiftNum: shiftNum,
              count: trackerEntry.count,
              isLsc: false,
              alreadyAssigned: checkAssigned(trackerEntry)
            });
          }
        });
      }

      // Sort: Already-assigned first (so they remain visible in top 3),
      // then lowest count cohort (using pre-standby count if already assigned),
      // then LSC sorted at the bottom of its cohort, then highest shift number descending.
      candidates.sort((a, b) => {
        if (a.alreadyAssigned !== b.alreadyAssigned) {
          return a.alreadyAssigned ? -1 : 1;
        }
        const countA = a.alreadyAssigned ? a.count - 1 : a.count;
        const countB = b.alreadyAssigned ? b.count - 1 : b.count;
        if (countA !== countB) return countA - countB;
        if (a.isLsc && b.isLsc) return a.name.localeCompare(b.name);
        if (a.isLsc) return 1;  // LSC goes to the bottom/last in the cohort
        if (b.isLsc) return -1;
        return b.shiftNum - a.shiftNum;  // highest shift# first
      });

      return candidates;
    }

    async function toggleStandbyCandidate(badge, name, isoDateStr, currentAssigned, accentColor, role) {
      const isChecked = !currentAssigned;

      // Find the day in cachedDaysList
      const dayIdx = cachedDaysList.findIndex(d => d && d.isoDateStr === isoDateStr);
      if (dayIdx === -1) return;
      const day = cachedDaysList[dayIdx];

      const dateId = day.dateStr.replace(/[^a-zA-Z0-9]/g, '');

      // Mark as pending save
      const saveKey = `${name}|${isoDateStr}`;
      pendingStandbySaves.add(saveKey);

      // 1. Create a deep copy of standbyTracker and sign-offs for rollback
      const standbyTrackerBackup = JSON.parse(JSON.stringify(day.standbyTracker || []));
      const signOffsBackup = JSON.parse(JSON.stringify(day.signOffs || []));
      const allSignOffsBackup = JSON.parse(JSON.stringify(allSignOffsList || []));

      // 2. Perform Optimistic Update in cache
      if (!day.standbyTracker) day.standbyTracker = [];

      // Find the employee in day.standbyTracker
      let employeeEntry = day.standbyTracker.find(e => e.name.toLowerCase().split('(')[0].trim() === name.toLowerCase().trim());
      if (!employeeEntry) {
        employeeEntry = { name: name, count: 0, dates: [] };
        day.standbyTracker.push(employeeEntry);
      }

      // Parse dates list
      let datesArray = ensureDatesArray(employeeEntry.dates);
      const isAssignedNow = isChecked;
      if (isAssignedNow) {
        const exists = datesArray.some(d => datesMatch(d, isoDateStr));
        if (!exists) {
          const year = isoDateStr.split('-')[0];
          const parts = isoDateStr.split('-');
          const m = String(parseInt(parts[1], 10)).padStart(2, '0');
          const d = String(parseInt(parts[2], 10)).padStart(2, '0');
          datesArray.push(`${m}/${d}/${year}`);
          employeeEntry.count = (employeeEntry.count || 0) + 1;
        }

        // Add to day.signOffs and allSignOffsList optimistically
        const cleanName = name.toLowerCase().trim();
        const alreadySignedOff = (day.signOffs || []).some(s => s.name.toLowerCase().split('(')[0].trim() === cleanName && s.role === role);
        if (!alreadySignedOff) {
          if (!day.signOffs) day.signOffs = [];
          const newSignOff = {
            dateStr: day.dateStr,
            name: name,
            role: role,
            arrivalTime: "7:00 AM",
            time: "7:00 AM"
          };
          day.signOffs.push(newSignOff);
          allSignOffsList.push(newSignOff);
        }
      } else {
        const idx = datesArray.findIndex(d => datesMatch(d, isoDateStr));
        if (idx !== -1) {
          datesArray.splice(idx, 1);
          employeeEntry.count = Math.max(0, (employeeEntry.count || 0) - 1);
        }

        // Remove from day.signOffs and allSignOffsList
        const cleanName = name.toLowerCase().trim();
        if (day.signOffs) {
          day.signOffs = day.signOffs.filter(s => !(s.name.toLowerCase().split('(')[0].trim() === cleanName && s.role === role));
        }
        allSignOffsList = allSignOffsList.filter(s => !(s.name.toLowerCase().split('(')[0].trim() === cleanName && s.role === role && s.dateStr === day.dateStr));
      }
      employeeEntry.dates = datesArray;

      // 3. Instantly Update the UI (Standby UI and staffing checkboxes)
      updateStandbyUI(dayIdx);
      if (typeof syncCheckboxes === 'function') {
        syncCheckboxes(allSignOffsList);
      }

      // 4. Send backend API call in background
      try {
        const result = await callApi('toggleStandbyAssignment', {
          name: name,
          dateStr: isoDateStr,
          isChecked: isChecked
        });

        if (!result || result.success === false) {
          throw new Error((result && result.error) || 'Toggle failed');
        }
      } catch (err) {
        console.error('toggleStandbyCandidate error:', err);
        showToast("Error updating standby: " + err.message);

        // Rollback state in memory and UI
        day.standbyTracker = standbyTrackerBackup;
        day.signOffs = signOffsBackup;
        allSignOffsList = allSignOffsBackup;
      } finally {
        pendingStandbySaves.delete(saveKey);
        updateStandbyUI(dayIdx);
        if (typeof syncCheckboxes === 'function') {
          syncCheckboxes(allSignOffsList);
        }
      }
    }

    document.getElementById('standby-tracker-modal').addEventListener('click', function (e) {
      if (e.target === this) closeStandbyTrackerModal();
    });
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      // Auto-reload the page when a new service worker takes control (e.g. cache bump)
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('New service worker activated. Reloading...');
          window.location.reload();
        }
      });

      navigator.serviceWorker.getRegistrations().then(registrations => {
        const targetScope = new URL('./', window.location.href).href;
        let unregisteredOld = false;
        const promises = registrations.map(reg => {
          if (reg.scope !== targetScope) {
            console.log('Unregistering old or conflicting SW scope:', reg.scope);
            unregisteredOld = true;
            return reg.unregister();
          }
          return Promise.resolve(false);
        });
        Promise.all(promises).then(() => {
          navigator.serviceWorker.register('./sw.js?v=105')
            .then(reg => {
              console.log('SW registered with scope:', reg.scope);
              if (unregisteredOld) {
                window.location.reload();
              }
            })
            .catch(err => console.warn('SW registration failed:', err));
        });
      });
    }

    function triggerGroupSms(dateStr, groupType) {
      if (typeof cachedDaysList === 'undefined' || !cachedDaysList) {
        alert("Schedule data is not loaded yet.");
        return;
      }
      const day = cachedDaysList.find(d => d && d.dateStr === dateStr);
      if (!day || !day.activePhones || day.activePhones.length === 0) {
        alert("No active phone contacts found for " + dateStr + ".");
        return;
      }

      const filteredPhones = day.activePhones.filter(ap => ap.group === groupType);
      if (filteredPhones.length === 0) {
        alert("No active phone contacts found in this group for " + dateStr + ".");
        return;
      }

      // Gather names of staff who have gone home (strikethrough in the DOM)
      const goneHomeNames = new Set();
      const dateId = dateStr.replace(/[^a-zA-Z0-9]/g, '');
      const dayRows = document.querySelectorAll(`[id^="row-${dateId}-"]`);
      dayRows.forEach(row => {
        const contentEl = row.querySelector('.entry-content');
        if (contentEl && contentEl.classList.contains('strikethrough')) {
          const nameEl = row.querySelector('.has-text-weight-bold');
          if (nameEl) {
            const cleanName = nameEl.textContent.trim().toLowerCase().split('(')[0].trim();
            if (cleanName) {
              goneHomeNames.add(cleanName);
            }
          }
        }
      });

      const phoneNumbers = filteredPhones
        .filter(ap => {
          const cleanApName = String(ap.name || "").toLowerCase().split('(')[0].trim();
          // Exclude any staff members who are marked as gone home (strikethrough) in the UI
          return !goneHomeNames.has(cleanApName);
        })
        .map(ap => {
          let p = String(ap.phone || "").trim();
          const hasPlus = p.startsWith('+');
          p = p.replace(/[^0-9]/g, '');
          if (hasPlus) p = '+' + p;
          return p;
        })
        .filter(p => p.length >= 10);

      const uniqueNumbers = [...new Set(phoneNumbers)];
      if (uniqueNumbers.length === 0) {
        alert("No active phone numbers found in this group for " + dateStr + " (everyone may have gone home).");
        return;
      }

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      let url;
      if (isIOS) {
        url = `sms:open?addresses=${uniqueNumbers.join(',')}`;
      } else {
        url = `sms:${uniqueNumbers.join(',')}`;
      }
      window.location.href = url;

      body.innerHTML = `
        <div style="text-align:center; color:#94a3b8; padding:30px;">
          <div style="font-size:2rem; animation:spin 1s linear infinite; display:inline-block;">⏳</div>
          <div style="margin-top:12px; font-size:0.9rem; font-weight:700;">${sendEmail ? 'Uploading & Emailing...' : 'Uploading...'}</div>
          <div style="margin-top:6px; font-size:0.8rem; color:#64748b;">${sendEmail ? 'This will overwrite any existing schedule for this date and email the group.' : 'This will overwrite any existing schedule for this date (email skipped).'}</div>
        </div>`;
      meta.textContent = 'Processing file...';

      reader.onload = async function (e) {
        const dataUri = e.target.result;
        const commaIdx = dataUri.indexOf(',');
        const base64Data = dataUri.substring(commaIdx + 1);
        const contentType = file.type || "application/pdf";

        try {
          const res = await callApi('uploadScheduleFile', {
            dateStr: activeModalDate,
            fileName: file.name,
            base64Data: base64Data,
            contentType: contentType,
            sendEmail: sendEmail
          });

          if (res && res.success) {
            showToast(res.emailSent ? 'Schedule uploaded and emailed successfully!' : 'Schedule uploaded successfully (email skipped)!', 'success');
            updateScheduleButtonState(activeModalDate);
            await openScheduleModal(activeModalDate);
          } else {
            showToast('Upload failed: ' + (res.error || 'Unknown error'));
            await openScheduleModal(activeModalDate);
          }
        } catch (err) {
          showToast('Upload failed: ' + err.message);
          await openScheduleModal(activeModalDate);
        }
      };

      reader.readAsDataURL(file);
      input.value = '';
    }

    async function renderScheduleContent(data) {
      const body = document.getElementById('schedule-modal-body');
      const meta = document.getElementById('schedule-modal-meta');
      meta.textContent = data.emailDate ? `Uploaded on: ${data.emailDate}` : 'Schedule loaded';

      const dataUri = data.base64 ? `data:${data.mimeType};base64,${data.base64}` : '';
      const mime = (data.mimeType || '').toLowerCase();

      if (mime === 'application/pdf') {
        body.innerHTML = `
          <div id="pdf-viewer-container" style="width:100%; display:flex; flex-direction:column; gap:16px; align-items:center;">
            <div id="pdf-rendering-progress" style="text-align:center; color:#94a3b8; padding:20px;">
              <div style="font-size:1.5rem; animation:spin 1s linear infinite; display:inline-block; margin-bottom:10px;">⏳</div>
              <div style="font-size:0.9rem;">Rendering PDF pages...</div>
            </div>
          </div>`;

        const container = document.getElementById('pdf-viewer-container');

        try {
          // Initialize PDF.js worker
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

          // Load document binary
          const pdfData = base64ToUint8Array(data.base64);
          const loadingTask = pdfjsLib.getDocument({ data: pdfData });
          const pdf = await loadingTask.promise;

          const progressEl = document.getElementById('pdf-rendering-progress');
          if (progressEl) progressEl.remove();

          const containerWidth = body.clientWidth || 800;

          // Render pages sequentially
          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.0 });

            // Adjust to container boundary with padding
            const displayWidth = Math.min(viewport.width, containerWidth - 30);
            const ratio = displayWidth / viewport.width;

            // Render at high-DPI scale (1.5x display density) for handwritten legibility
            const dpr = window.devicePixelRatio || 1;
            const renderScale = ratio * dpr * 1.5;
            const renderViewport = page.getViewport({ scale: renderScale });

            const canvas = document.createElement('canvas');
            canvas.className = 'pdf-page-canvas';
            canvas.style.width = `${displayWidth}px`;
            canvas.style.height = `${displayWidth * (viewport.height / viewport.width)}px`;
            canvas.style.boxShadow = '0 10px 25px rgba(0,0,0,0.4)';
            canvas.style.borderRadius = '8px';
            canvas.style.backgroundColor = '#ffffff';
            canvas.style.display = 'block';

            canvas.width = renderViewport.width;
            canvas.height = renderViewport.height;

            container.appendChild(canvas);

            const context = canvas.getContext('2d');
            const renderContext = {
              canvasContext: context,
              viewport: renderViewport
            };

            await page.render(renderContext).promise;
          }

          // Append download, raw link, and upload revision options
          const actionContainer = document.createElement('div');
          actionContainer.style.cssText = "margin-top:20px; display:flex; gap:12px; justify-content:center; align-items:center; width:100%; flex-wrap:wrap;";
          actionContainer.innerHTML = `
            <a href="${dataUri}" download="${data.fileName || 'schedule.pdf'}" target="_blank"
              style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#e2e8f0; text-decoration:none; padding:8px 18px; border-radius:8px; font-weight:700; font-size:0.85rem; display:inline-block; cursor:pointer;">
              ⬇️ Download PDF
            </a>
            ${data.fileId ? `
            <a href="https://drive.google.com/file/d/${data.fileId}/view?usp=drivesdk" target="_blank"
              style="background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#e2e8f0; text-decoration:none; padding:8px 18px; border-radius:8px; font-weight:700; font-size:0.85rem; display:inline-block; cursor:pointer;">
              🔗 Open in Drive
            </a>` : ''}
            <button onclick="triggerFileUpload()"
              style="background:linear-gradient(135deg,#10b981,#059669); border:none; color:#fff; padding:9px 19px; border-radius:8px; font-weight:700; font-size:0.85rem; display:inline-block; cursor:pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.3);">
              📤 Upload Revision
            </button>
          `;
          container.appendChild(actionContainer);

        } catch (error) {
          console.error("PDF.js loading error: ", error);
          body.innerHTML = `
            <div style="text-align:center; color:#ef4444; padding:30px; width:100%;">
              <div style="font-size:1.15rem; font-weight:700;">Failed to render schedule PDF</div>
              <div style="font-size:0.82rem; color:#94a3b8; margin-top:8px;">${error.message}</div>
              <div style="margin-top:20px;">
                ${data.fileId ? `
                <a href="https://drive.google.com/file/d/${data.fileId}/view" target="_blank" 
                   style="background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; text-decoration:none; padding:8px 18px; border-radius:8px; font-weight:700; font-size:0.85rem; display:inline-block;">
                  Open directly in Google Drive
                </a>` : ''}
              </div>
            </div>`;
        }
      } else if (mime.startsWith('image/')) {
        body.innerHTML = `
          <div style="width:100%; text-align:center; cursor:zoom-in;" onclick="toggleImgZoom(this)">
            <img src="${dataUri}" alt="Daily Schedule"
              style="max-width:100%; border-radius:10px; border:1px solid rgba(255,255,255,0.08); transition:transform 0.25s ease;"
              title="Click to zoom" />
            <div style="font-size:0.72rem; color:#64748b; margin-top:8px;">Tap image to zoom in/out</div>
          </div>`;
      } else {
        body.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:20px;">
          <div style="font-size:0.9rem;">Unsupported file type: ${data.mimeType}</div>
          <a href="${dataUri || 'https://drive.google.com/file/d/' + data.fileId + '/view'}" download="${data.fileName || 'schedule'}" style="margin-top:10px; display:inline-block; color:#a5b4fc;">⬇️ Download</a>
        </div>`;
      }
    }

    function toggleImgZoom(wrapper) {
      const img = wrapper.querySelector('img');
      if (!img) return;
      const isZoomed = img.style.transform && img.style.transform !== 'none';
      img.style.transform = isZoomed ? 'none' : 'scale(1.85)';
      img.style.transformOrigin = 'top center';
      wrapper.style.cursor = isZoomed ? 'zoom-in' : 'zoom-out';
      wrapper.style.overflow = isZoomed ? 'visible' : 'hidden';
    }

    function closeScheduleModal() {
      document.getElementById('schedule-modal').style.display = 'none';
      document.body.style.overflow = '';
    }

    async function resyncScheduleEmail() {
      const body = document.getElementById('schedule-modal-body');
      const meta = document.getElementById('schedule-modal-meta');
      const btn = document.getElementById('btn-schedule-resync');
      if (btn) btn.disabled = true;
      body.innerHTML = `
        <div style="text-align:center; color:#94a3b8;">
          <div style="font-size:2rem; animation:spin 1s linear infinite; display:inline-block;">⏳</div>
          <div style="margin-top:10px; font-size:0.9rem;">Scanning mailbox for latest schedule...</div>
        </div>`;
      meta.textContent = 'Re-syncing...';
      try {
        const syncRes = await callApi('syncScheduleEmail', { forceRefresh: true });
        const data = await callApi('getScheduleForDate', { dateStr: activeModalDate });
        if (data && data.found) {
          scheduleDataCache[activeModalDate] = data;
          updateScheduleButtonState(activeModalDate);
          renderScheduleContent(data);
          showToast('Schedule updated!', 'success');
        } else {
          const displayData = data || {};
          if (syncRes && syncRes.log) displayData.log = syncRes.log;
          renderSyncFailure(body, displayData);
          meta.textContent = 'No attachment found.';
        }
      } catch (err) {
        meta.textContent = 'Sync failed.';
        showToast('Re-sync failed: ' + err.message);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    document.getElementById('schedule-modal').addEventListener('click', function (e) {
      if (e.target === this) closeScheduleModal();
    });
  </script>

  <input type="file" id="schedule-file-uploader" style="display:none;" accept="application/pdf"
    onchange="handleScheduleUpload(this)">

  <!-- ============================================================
     SCHEDULE EMAIL VIEWER MODAL
     ============================================================ -->
  <div id="schedule-modal"
    style="display:none; position:fixed; inset:0; z-index:9000; background:rgba(10,10,20,0.82); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); overflow-y:auto;">
    <div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:20px 12px;">
      <div
        style="background:#1e1e2e; border:1px solid rgba(255,255,255,0.1); border-radius:18px; width:100%; max-width:820px; box-shadow:0 24px 80px rgba(0,0,0,0.7); overflow:hidden;">

        <!-- Modal Header -->
        <div
          style="padding:18px 22px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.08);">
          <div>
            <div class="schedule-modal-title-text"
              style="font-weight:800; font-size:1.1rem; color:#e2e8f0; letter-spacing:-0.02em;">📄 Email Schedule</div>
            <div id="schedule-modal-meta" style="font-size:0.78rem; color:#94a3b8; margin-top:3px;">Searching for latest
              attachment...</div>
          </div>
          <div style="display:flex; gap:8px; align-items:center;">
            <button id="btn-schedule-resync" onclick="resyncScheduleEmail()" title="Re-scan inbox for latest attachment"
              style="background:rgba(102,126,234,0.18); border:1px solid rgba(102,126,234,0.35); border-radius:8px; color:#a5b4fc; font-size:0.8rem; font-weight:700; padding:6px 12px; cursor:pointer; transition:all 0.2s;">
              🔄 Re-sync
            </button>
            <button onclick="closeScheduleModal()"
              style="background:rgba(255,255,255,0.08); border:none; border-radius:8px; color:#94a3b8; font-size:1.3rem; width:36px; height:36px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s;"
              title="Close">&times;</button>
          </div>
        </div>

        <!-- Modal Body -->
        <div id="schedule-modal-body"
          style="padding:20px; min-height:280px; display:flex; align-items:center; justify-content:center;">
          <div style="text-align:center; color:#64748b;">
            <div style="font-size:2.5rem; margin-bottom:12px;">📂</div>
            <div style="font-size:0.9rem;">No schedule loaded yet.</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- ============================================================
     STANDBY TRACKER MODAL
     ============================================================ -->
  <div id="standby-tracker-modal" class="modal">
    <div class="modal-background" onclick="closeStandbyTrackerModal()"></div>
    <div class="modal-card"
      style="max-width: 600px; width: 95%; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);">
      <header class="modal-card-head" style="background: var(--card-bg); border-bottom: 1px solid var(--border-color);">
        <p class="modal-card-title has-text-weight-bold"
          style="font-size: 1.25rem; color: var(--text-main) !important;">🛡️ Standby Tracker</p>
        <button class="delete" aria-label="close" onclick="closeStandbyTrackerModal()"></button>
      </header>
      <section class="modal-card-body" id="standby-tracker-modal-body"
        style="background: var(--bg-gradient); padding: 24px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; color: var(--text-main);">
        <!-- Content will be rendered dynamically here -->
      </section>
    </div>
  </div>
