<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Sign-offs (Timekeeper)</title>
  
  <!-- Bulma and Custom Premium Stylesheet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="css/style.css?v=41">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest_timekeeper.json?v=6">




  <!-- iOS PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anaesthesia">
  <meta name="theme-color" content="#3273dc">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="snoozle.png">
  <link rel="icon" type="image/png" sizes="192x192" href="snoozle.png">
  <link rel="apple-touch-icon" sizes="180x180" href="snoozle.png">
</head>

<body>
  <div class="container mt-4">
    <div class="mb-4 is-flex is-justify-content-center">
      <div class="is-size-7 has-text-grey-light">
        Last updated: <span id="timestamp-display">Loading...</span>
      </div>
    </div>

    <!-- Date selector for entry page -->
    <div id="date-selector-container" class="mb-5 is-flex is-justify-content-center is-align-items-center" style="display: flex; gap: 10px;">
      <label class="label mb-0" for="entry-date-picker" style="font-size: 0.95rem; font-weight: 700; color: var(--text-main);">Select Date:</label>
      <div class="control">
        <input class="input is-small" type="date" id="entry-date-picker" style="max-width: 160px; font-weight: 600; background-color: #ffffff !important; color: #0f172a !important; color-scheme: light;">
      </div>
      <button class="button is-small is-light" id="btn-force-refresh" onclick="forceRefreshSchedule()" title="Force refresh schedule from Google Sheets" style="height: 28px; border-radius: 8px; font-size: 0.85rem; padding: 0 10px;">
        🔄 Refresh
      </button>
      <button class="button is-small" id="btn-view-schedule" onclick="openScheduleModal()" title="View today's emailed schedule" style="height: 28px; border-radius: 8px; font-size: 0.85rem; padding: 0 10px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; font-weight: 700; box-shadow: 0 2px 8px rgba(118,75,162,0.35);">
        📄 Schedule
      </button>
    </div>


    <!-- Main Content Area -->
    <div id="content" class="entry-page">
      <div class="loading-wrap">
        <button class="button is-loading is-white is-large"></button>
        <p>Analyzing schedules and mapping physicians...</p>
      </div>
    </div>
  </div>

  <!-- Load Configuration & API Helper first -->
  <script src="config.js"></script>
  <script src="js/api.js"></script>

  <script>
    const currentPage = "entry";
    const IS_READ_ONLY = false;
    // Tracks row IDs that are mid-flight (awaiting API response) so the
    // background poll does not reset their visual state prematurely.
    const pendingRows = new Set();

    let viewMode = 'time';
    // Cache the latest data so we can re-render when toggling views
    let cachedData = null;
    // Cache for all sign-offs to calculate weekly totals
    let allSignOffsList = [];
    // Transfer edit mode: when false, transfer buttons are hidden
    let transferEditMode = false;

    function setTransferEditMode(on) {
      transferEditMode = !!on;
      // Only toggle visibility on un-transferred (pending) buttons
      // Already-transferred (active/red) buttons are always visible
      document.querySelectorAll('.transfer-btn-pending').forEach(btn => {
        btn.style.display = transferEditMode ? 'inline-flex' : 'none';
      });
      // Sync the toggle slider(s) in case multiple days are rendered
      document.querySelectorAll('.transfer-mode-checkbox').forEach(cb => {
        cb.checked = transferEditMode;
      });
    }

    function showToast(message, type = 'danger') {
      let toast = document.getElementById('api-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'api-toast';
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.padding = '12px 24px';
        toast.style.borderRadius = '8px';
        toast.style.color = '#fff';
        toast.style.zIndex = '9999';
        toast.style.fontWeight = '600';
        toast.style.fontSize = '0.9rem';
        toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
        toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease, bottom 0.3s ease';
        document.body.appendChild(toast);
      }
      toast.style.backgroundColor = type === 'success' ? '#10b981' : '#ef4444';
      toast.innerText = message;
      toast.style.opacity = '1';
      toast.style.bottom = '30px';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.bottom = '20px';
      }, 4000);
    }

    function setViewMode(mode) {
      viewMode = mode;
      
      // Update tab active classes
      document.querySelectorAll('#view-tabs li').forEach(li => li.classList.remove('is-active'));
      const activeTab = document.getElementById(`tab-${mode}`);
      if (activeTab) activeTab.classList.add('is-active');
      
      if (cachedData) render(cachedData);
    }

    function toggleViewMode() {
      if (viewMode === 'time') {
        setViewMode('break');
      } else if (viewMode === 'break') {
        setViewMode('hours');
      } else {
        setViewMode('time');
      }
    }

    function calculateHoursWorked(arrivalStr, departureStr) {
      if (!arrivalStr || !departureStr) return 0;
      try {
        const parseTime = (timeStr) => {
          const [time, ampm] = timeStr.split(' ');
          let [h, m] = time.split(':');
          h = parseInt(h, 10);
          m = parseInt(m, 10);
          if (ampm === 'PM' && h !== 12) h += 12;
          if (ampm === 'AM' && h === 12) h = 0;
          return h * 60 + m; // minutes from midnight
        };
        const arrMin = parseTime(arrivalStr);
        const depMin = parseTime(departureStr);
        if (depMin > arrMin) {
          return (depMin - arrMin) / 60;
        }
      } catch (e) {
        console.error("Error calculating hours:", e);
      }
      return 0;
    }

    function calculateRunningWeeklyHours(employeeName, employeeRole, targetDateStr, allSignOffs) {
      const picker = document.getElementById('entry-date-picker');
      const activeDateVal = picker ? picker.value : ''; // "YYYY-MM-DD"
      const activeYear = activeDateVal ? parseInt(activeDateVal.split('-')[0], 10) : new Date().getFullYear();
      
      const cleanDateStr = targetDateStr.replace(/^[A-Za-z]+,\s+/, ''); // "May 28"
      const dateParts = cleanDateStr.split(' ');
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const monthIdx = monthNames.indexOf(dateParts[0].substring(0, 3));
      const dayNum = parseInt(dateParts[1], 10);
      
      const targetDateObj = new Date(activeYear, monthIdx, dayNum);
      
      const dayOfWeek = targetDateObj.getDay();
      const distToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const monday = new Date(targetDateObj);
      monday.setDate(targetDateObj.getDate() + distToMonday);
      
      const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const dateStrings = [];
      
      const tempDate = new Date(monday);
      while (tempDate <= targetDateObj) {
        const formatted = `${weekdays[tempDate.getDay()]}, ${months[tempDate.getMonth()]} ${tempDate.getDate()}`;
        dateStrings.push(formatted);
        tempDate.setDate(tempDate.getDate() + 1);
      }
      
      const getBaseName = (name) => {
        return String(name || "").replace(/\s*\([^)]*\)/g, '').trim().toLowerCase();
      };

      let totalHours = 0;
      const targetBaseName = getBaseName(employeeName);
      (allSignOffs || []).forEach(s => {
        if (getBaseName(s.name) === targetBaseName && 
            dateStrings.includes(s.dateStr)) {
          totalHours += calculateHoursWorked(s.arrivalTime, s.time);
        }
      });
      
      return {
        hours: totalHours.toFixed(1),
        rangeLabel: `Mon-${weekdays[targetDateObj.getDay()].substring(0, 3)}`
      };
    }

    function updateLocalCacheSignOff(dateStr, name, role, arrivalTime, departureTime) {
      if (!cachedData) return;
      const day = cachedData.find(d => d.dateStr === dateStr);
      if (!day) return;
      if (!day.signOffs) day.signOffs = [];
      
      let signOff = day.signOffs.find(s => String(s.name) === String(name) && String(s.role) === String(role));
      if (!signOff) {
        signOff = {
          dateStr: dateStr,
          name: name,
          role: role,
          arrivalTime: "",
          time: ""
        };
        day.signOffs.push(signOff);
      }
      
      if (arrivalTime !== undefined) signOff.arrivalTime = arrivalTime;
      if (departureTime !== undefined) signOff.time = departureTime;
      
      // Remove if both empty
      if (!signOff.arrivalTime && !signOff.time) {
        day.signOffs = day.signOffs.filter(s => !(String(s.name) === String(name) && String(s.role) === String(role)));
      }

      // Also update allSignOffsList
      let globalSignOff = allSignOffsList.find(s => String(s.name) === String(name) && String(s.role) === String(role) && String(s.dateStr) === String(dateStr));
      if (!globalSignOff) {
        globalSignOff = {
          dateStr: dateStr,
          name: name,
          role: role,
          arrivalTime: "",
          time: ""
        };
        allSignOffsList.push(globalSignOff);
      }
      if (arrivalTime !== undefined) globalSignOff.arrivalTime = arrivalTime;
      if (departureTime !== undefined) globalSignOff.time = departureTime;
      
      if (!globalSignOff.arrivalTime && !globalSignOff.time) {
        allSignOffsList = allSignOffsList.filter(s => !(String(s.name) === String(name) && String(s.role) === String(role) && String(s.dateStr) === String(dateStr)));
      }
    }

    async function toggleBreakLunch(btn, name, role, dateStr, type) {
      const isChecked = !btn.classList.contains('active');
      btn.classList.add('is-loading');
      try {
        const res = await callApi("toggleBreakLunch", { name, role, dateStr, type, isChecked });
        btn.classList.remove('is-loading');
        if (res && res.success) {
          btn.classList.toggle('active', isChecked);
          showToast("Status updated successfully!", "success");
          if (cachedData) {
            const day = cachedData.find(d => d.dateStr === dateStr);
            if (day) {
              if (!day.breakLunchStates) day.breakLunchStates = {};
              const blKey = `${name}|${role}`;
              if (!day.breakLunchStates[blKey]) {
                day.breakLunchStates[blKey] = { break: false, lunch: false };
              }
              day.breakLunchStates[blKey][type] = isChecked;
            }
          }
        } else {
          showToast("Error: " + (res.error || "failed to update status."));
        }
      } catch (err) {
        btn.classList.remove('is-loading');
        showToast("Action failed: " + err.message);
      }
    }

    window.onload = () => {
      const picker = document.getElementById('entry-date-picker');
      const todayLocal = new Date();
      const yyyy = todayLocal.getFullYear();
      const mm = String(todayLocal.getMonth() + 1).padStart(2, '0');
      const dd = String(todayLocal.getDate()).padStart(2, '0');
      picker.value = `${yyyy}-${mm}-${dd}`;
      
      picker.onchange = () => {
        fetchFreshData(picker.value);
      };

      fetchFreshData(picker.value);
    };

    // Poll for updates every 30 seconds
    setInterval(pollSignOffs, 30000);

    async function pollSignOffs() {
      try {
        const picker = document.getElementById('entry-date-picker');
        const activeDate = picker ? picker.value : '';
        const update = await callApi("getSnapshotPollUpdate", { dateStr: activeDate });
        
        allSignOffsList = update.signOffs || [];
        
        // Update cachedData in memory
        if (cachedData) {
          cachedData.forEach(day => {
            day.signOffs = update.signOffs.filter(s => s.dateStr === day.dateStr);
            if (update.breakLunchStatesByDate && update.breakLunchStatesByDate[day.dateStr]) {
              day.breakLunchStates = update.breakLunchStatesByDate[day.dateStr];
            }
          });
        }
        
        syncCheckboxes(update.signOffs, update.breakLunchStatesByDate);
      } catch (err) {
        console.error("Polling error:", err);
      }
    }

    function syncCheckboxes(liveSignOffs, breakLunchStatesByDate) {
      const signedOffKeys = new Map(liveSignOffs.map(s => [`${s.name}|${s.role}|${s.dateStr}`, s]));
      const blStatesByDate = breakLunchStatesByDate || {};
      const isEntry = (currentPage === "entry");

      document.querySelectorAll('.entry').forEach(entryRow => {
        const content = entryRow.querySelector('.entry-content');
        if (!content) return;

        // Skip rows that have a pending API call in progress
        if (pendingRows.has(entryRow.id)) return;

        const arrivalCb = entryRow.querySelector('.arrival-checkbox');
        const departureCb = entryRow.querySelector('.departure-checkbox') || entryRow.querySelector('.gone-home-checkbox');
        
        // In break view mode, time controls may not exist — use row data-* attributes instead
        const name = departureCb ? departureCb.dataset.name : entryRow.dataset.name;
        const role = departureCb ? departureCb.dataset.role : entryRow.dataset.role;
        const dateStr = departureCb ? departureCb.dataset.date : entryRow.dataset.date;
        if (!name || !role || !dateStr) return;
        const key = `${name}|${role}|${dateStr}`;
        const data = signedOffKeys.get(key);

        const arrivalTimeWrapper = entryRow.querySelector('.arrival-time-wrapper');
        const departureTimeWrapper = entryRow.querySelector('.departure-time-wrapper');
        const arrivalTimeInput = arrivalTimeWrapper ? arrivalTimeWrapper.querySelector('input[type="time"]') : null;
        const departureTimeInput = departureTimeWrapper ? departureTimeWrapper.querySelector('input[type="time"]') : null;

        // Clear existing display spans across the whole row
        entryRow.querySelectorAll('.arrival-time-display, .departure-time-display').forEach(el => el.remove());

        // If in hours view mode, we ONLY want to sync the running hours badge and nothing else!
        if (viewMode === 'hours') {
          const hoursDisplay = entryRow.querySelector('.hours-display-wrapper');
          if (hoursDisplay) {
            const res = calculateRunningWeeklyHours(name, role, dateStr, allSignOffsList);
            hoursDisplay.innerHTML = `<span class="tag is-info is-medium" style="font-weight: 700; border-radius: 8px;">📊 ${res.hours} hrs <span style="font-size: 0.75rem; font-weight: 600; margin-left: 4px; opacity: 0.85;">(${res.rangeLabel})</span></span>`;
          }
          if (data && data.time) {
            content.classList.add('strikethrough');
          } else {
            content.classList.remove('strikethrough');
          }
          return;
        }

        // If in break view mode, we ONLY want to sync the break/lunch/OB buttons and nothing else!
        if (viewMode === 'break') {
          const dayState = blStatesByDate[dateStr] || {};
          const blKey = `${name}|${role}`;
          const bl = dayState[blKey] || { break: false, lunch: false, ob: false };
          const blControls = entryRow.querySelector('.break-lunch-controls');
          if (blControls) {
            const btnBreak = blControls.querySelector('.btn-break');
            const btnLunch = blControls.querySelector('.btn-lunch');
            if (btnBreak) btnBreak.classList.toggle('active', !!bl.break);
            if (btnLunch) btnLunch.classList.toggle('active', !!bl.lunch);
            
            const btnOb = blControls.querySelector('.btn-ob');
            if (btnOb) btnOb.classList.toggle('active', !!bl.ob);
          }
          if (data && data.time) {
            content.classList.add('strikethrough');
          } else {
            content.classList.remove('strikethrough');
          }
          return;
        }

        if (data) {
          // Sync Arrival (Entry Mode Only)
          if (isEntry && arrivalCb) {
            arrivalCb.checked = !!data.arrivalTime;
            if (arrivalTimeWrapper) arrivalTimeWrapper.style.display = data.arrivalTime ? 'none' : 'flex';
            if (arrivalTimeInput) {
              arrivalTimeInput.value = data.arrivalTime ? formatTimeForInput(data.arrivalTime) : '';
              updateTimeDisplay(arrivalTimeInput);
            }
          } else if (arrivalCb) {
            arrivalCb.style.display = 'none';
          }
          if (isEntry && data.arrivalTime) {
            const span = document.createElement('span');
            span.className = 'arrival-time-display';
            span.innerHTML = '<span class="time-prefix">IN @ </span>';
            span.appendChild(document.createTextNode(data.arrivalTime));
            
            const arrivalSwitch = entryRow.querySelector('.arrival-switch');
            if (arrivalSwitch) {
              arrivalSwitch.before(span);
            } else {
              content.appendChild(span);
            }
          }

          // Sync Departure
          if (departureCb) departureCb.checked = !!data.time;
          if (departureTimeWrapper) departureTimeWrapper.style.display = data.time ? 'none' : 'flex';
          if (departureTimeInput) {
            departureTimeInput.value = data.time ? formatTimeForInput(data.time) : '';
            updateTimeDisplay(departureTimeInput);
          }
          if (data.time) {
            const span = document.createElement('span');
            span.className = 'departure-time-display';
            span.innerHTML = '<span class="time-prefix">OUT @ </span>';
            span.appendChild(document.createTextNode(data.time));
            
            const departureSwitch = departureCb ? departureCb.closest('.switch-container') : null;
            if (departureSwitch) {
              departureSwitch.before(span);
            } else {
              content.appendChild(span);
            }
            content.classList.add('strikethrough');
          } else {
            content.classList.remove('strikethrough');
          }
        } else {
          // No sign-off data, ensure everything is unchecked and visible
          if (arrivalCb) arrivalCb.checked = false;
          if (departureCb) departureCb.checked = false;
          content.classList.remove('strikethrough');
          if (arrivalTimeWrapper) arrivalTimeWrapper.style.display = isEntry ? 'flex' : 'none'; 
          if (departureTimeWrapper) { 
            departureTimeWrapper.style.display = 'flex'; 
            if (departureTimeInput) { 
              departureTimeInput.value = ''; 
              updateTimeDisplay(departureTimeInput); 
            } 
          }
        }

        // Sync break/lunch/ob buttons
        const dayState = blStatesByDate[dateStr] || {};
        const blKey = `${name}|${role}`;
        const bl = dayState[blKey] || { break: false, lunch: false, ob: false };
        const blControls = entryRow.querySelector('.break-lunch-controls');
        if (viewMode === 'break' || role === 'MD Call') {
          if (blControls) {
            const btnBreak = blControls.querySelector('.btn-break');
            const btnLunch = blControls.querySelector('.btn-lunch');
            if (btnBreak) btnBreak.classList.toggle('active', !!bl.break);
            if (btnLunch) btnLunch.classList.toggle('active', !!bl.lunch);
            
            const btnOb = blControls.querySelector('.btn-ob');
            if (btnOb) btnOb.classList.toggle('active', !!bl.ob);
          }
        }

        // Sync running weekly hours badge if in hours view
        const hoursDisplay = entryRow.querySelector('.hours-display-wrapper');
        if (hoursDisplay) {
          const res = calculateRunningWeeklyHours(name, role, dateStr, allSignOffsList);
          hoursDisplay.innerHTML = `<span class="tag is-info is-medium" style="font-weight: 700; border-radius: 8px;">📊 ${res.hours} hrs <span style="font-size: 0.75rem; font-weight: 600; margin-left: 4px; opacity: 0.85;">(${res.rangeLabel})</span></span>`;
        }
      });
    }

    async function fetchFreshData(customDate) {
      document.getElementById('content').innerHTML = `
        <div class="loading-wrap">
          <button class="button is-loading is-white is-large"></button>
        </div>`;
      try {
        const picker = document.getElementById('entry-date-picker');
        const activeDate = customDate || (picker ? picker.value : '');
        const data = await callApi("getDailySnapshotData", { customDateStr: activeDate });
        cachedData = data;
        
        // Fetch all sign-offs to calculate weekly totals
        const update = await callApi("getSnapshotPollUpdate", { dateStr: activeDate });
        allSignOffsList = update.signOffs || [];
        
        const now = new Date();
        document.getElementById('timestamp-display').innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        render(data);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="notification is-danger">Error loading data: ${err.message}</div>`;
      }
    }

    async function forceRefreshSchedule() {
      const picker = document.getElementById('entry-date-picker');
      const dateVal = picker ? picker.value : '';
      
      const btn = document.getElementById('btn-force-refresh');
      if (btn) btn.classList.add('is-loading');
      
      document.getElementById('content').innerHTML = `
        <div class="loading-wrap">
          <button class="button is-loading is-white is-large"></button>
        </div>`;
      try {
        const data = await callApi("getDailySnapshotData", { customDateStr: dateVal, forceRefresh: true });
        cachedData = data;
        
        // Fetch all sign-offs to calculate weekly totals
        const update = await callApi("getSnapshotPollUpdate", { dateStr: dateVal });
        allSignOffsList = update.signOffs || [];
        
        const now = new Date();
        document.getElementById('timestamp-display').innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        render(data);
        showToast("Schedule refreshed from Sheet!", "success");
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="notification is-danger">Error refreshing data: ${err.message}</div>`;
      } finally {
        if (btn) btn.classList.remove('is-loading');
      }
    }

    function formatTimeForInput(timeStr) {
      if (!timeStr) return '';
      const [time, ampm] = timeStr.split(' ');
      let [h, m] = time.split(':');
      h = parseInt(h, 10);
      if (ampm === 'PM' && h !== 12) h += 12;
      if (ampm === 'AM' && h === 12) h = 0;
      return `${String(h).padStart(2, '0')}:${m}`;
    }

    function canTransfer(name) {
      const n = String(name || "").toLowerCase();
      return !n.includes("travis") && !n.includes("nancy");
    }

    async function toggleEmployeeLocation(btn, name, dateStr, target) {
      btn.classList.add('is-loading');
      try {
        const res = await callApi("transferEmployee", { name, dateStr, target });
        if (res && res.success) {
          showToast(`Transferred ${name} successfully!`, "success");
          const picker = document.getElementById('entry-date-picker');
          await fetchFreshData(picker ? picker.value : '');
        } else {
          showToast("Error: " + (res.error || "Failed to transfer employee."));
          btn.classList.remove('is-loading');
        }
      } catch (err) {
        showToast("Transfer failed: " + err.message);
        btn.classList.remove('is-loading');
      }
    }

    async function toggleArrival(checkbox, name, role, dateStr, targetId) {
      const row = document.getElementById(targetId);
      const content = row.querySelector('.entry-content');
      const arrivalTimeWrapper = row.querySelector('.arrival-time-wrapper');
      const arrivalTimeInput = arrivalTimeWrapper ? arrivalTimeWrapper.querySelector('input[type="time"]') : null;
      const manualTime = (arrivalTimeInput && checkbox.checked) ? arrivalTimeInput.value : null;

      if (arrivalTimeWrapper) arrivalTimeWrapper.style.display = checkbox.checked ? 'none' : 'flex';

      pendingRows.add(targetId);
      try {
        const res = await callApi("toggleArrival", { name, role, dateStr, isChecked: checkbox.checked, manualTime });
        const existingArrivalDisplay = row.querySelector('.arrival-time-display');
        if (existingArrivalDisplay) existingArrivalDisplay.remove();

        if (res.status && res.timestamp) {
          const span = document.createElement('span');
          span.className = 'arrival-time-display';
          span.innerHTML = '<span class="time-prefix">IN @ </span>';
          span.appendChild(document.createTextNode(res.timestamp));
          
          const arrivalSwitch = row.querySelector('.arrival-switch');
          if (arrivalSwitch) {
            arrivalSwitch.before(span);
          } else {
            content.appendChild(span);
          }
          updateLocalCacheSignOff(dateStr, name, role, res.timestamp, undefined);
        } else if (!res.status && arrivalTimeInput) {
          arrivalTimeInput.value = '';
          updateTimeDisplay(arrivalTimeInput);
          updateLocalCacheSignOff(dateStr, name, role, "", undefined);
        }
      } catch (err) {
        alert("Arrival action failed: " + err.message);
        checkbox.checked = !checkbox.checked;
        if (arrivalTimeWrapper) arrivalTimeWrapper.style.display = checkbox.checked ? 'none' : 'flex';
      } finally {
        pendingRows.delete(targetId);
      }
    }

    async function toggleDeparture(checkbox, name, role, dateStr, targetId) {
      const row = document.getElementById(targetId);
      const content = row.querySelector('.entry-content');
      const departureTimeWrapper = row.querySelector('.departure-time-wrapper');
      const departureTimeInput = departureTimeWrapper ? departureTimeWrapper.querySelector('input[type="time"]') : null;
      const manualTime = (departureTimeInput && checkbox.checked) ? departureTimeInput.value : null;

      content.classList.toggle('strikethrough', checkbox.checked);
      if (departureTimeWrapper) departureTimeWrapper.style.display = checkbox.checked ? 'none' : 'flex';

      pendingRows.add(targetId);
      try {
        const res = await callApi("toggleSignOff", { name, role, dateStr, isChecked: checkbox.checked, manualTime });
        const existingDepartureDisplay = row.querySelector('.departure-time-display');
        if (existingDepartureDisplay) existingDepartureDisplay.remove();

        if (res.status && res.timestamp) {
          const span = document.createElement('span');
          span.className = 'departure-time-display';
          span.innerHTML = '<span class="time-prefix">OUT @ </span>';
          span.appendChild(document.createTextNode(res.timestamp));
          
          const departureSwitch = checkbox.closest('.switch-container');
          if (departureSwitch) {
            departureSwitch.before(span);
          } else {
            content.appendChild(span);
          }

          if (res.arrivalTime) {
            const arrivalCb = row.querySelector('.arrival-checkbox');
            const arrivalTimeWrapper = row.querySelector('.arrival-time-wrapper');
            if (arrivalCb && !arrivalCb.checked) {
              arrivalCb.checked = true;
              if (arrivalTimeWrapper) arrivalTimeWrapper.style.display = 'none';
              
              const existingArrivalDisplay = row.querySelector('.arrival-time-display');
              if (existingArrivalDisplay) existingArrivalDisplay.remove();

              const aSpan = document.createElement('span');
              aSpan.className = 'arrival-time-display';
              aSpan.innerHTML = '<span class="time-prefix">IN @ </span>';
              aSpan.appendChild(document.createTextNode(res.arrivalTime));
              
              const arrivalSwitch = row.querySelector('.arrival-switch');
              if (arrivalSwitch) {
                arrivalSwitch.before(aSpan);
              } else {
                content.appendChild(aSpan);
              }
            }
            updateLocalCacheSignOff(dateStr, name, role, res.arrivalTime, res.timestamp);
          } else {
            updateLocalCacheSignOff(dateStr, name, role, undefined, res.timestamp);
          }
        } else if (!res.status && departureTimeInput) {
          departureTimeInput.value = '';
          updateTimeDisplay(departureTimeInput);
          updateLocalCacheSignOff(dateStr, name, role, undefined, "");
        }
      } catch (err) {
        alert("Departure action failed: " + err.message);
        checkbox.checked = !checkbox.checked;
        content.classList.toggle('strikethrough', checkbox.checked);
        if (departureTimeWrapper) departureTimeWrapper.style.display = checkbox.checked ? 'none' : 'flex';
      } finally {
        pendingRows.delete(targetId);
      }
    }

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      // Auto-reload the page when a new service worker takes control (e.g. cache bump)
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('New service worker activated. Reloading...');
          window.location.reload();
        }
      });

      navigator.serviceWorker.getRegistrations().then(registrations => {
        const targetScope = new URL('./timekeeper.html', window.location.href).href;
        let unregisteredOld = false;
        const promises = registrations.map(reg => {
          if (reg.scope !== targetScope) {
            console.log('Unregistering old or conflicting SW scope:', reg.scope);
            unregisteredOld = true;
            return reg.unregister();
          }
          return Promise.resolve(false);
        });
        Promise.all(promises).then(() => {
          navigator.serviceWorker.register('./sw.js?v=56', { scope: './timekeeper.html' })
            .then(reg => {
              console.log('SW registered with scope:', reg.scope);
              if (unregisteredOld) {
                // Reload to let the new scoped service worker take control immediately
                window.location.reload();
              }
            })
            .catch(err => console.warn('SW registration failed:', err));
        });
      });
    }
  </script>

  <script>
    // ─── Schedule Email Viewer ─────────────────────────────────────────────────
    let scheduleDataCache = null;

    async function openScheduleModal() {
      const modal = document.getElementById('schedule-modal');
      const body = document.getElementById('schedule-modal-body');
      const meta = document.getElementById('schedule-modal-meta');
      modal.style.display = 'block';
      document.body.style.overflow = 'hidden';

      if (scheduleDataCache) {
        renderScheduleContent(scheduleDataCache);
        return;
      }

      // Show spinner
      body.innerHTML = `
        <div style="text-align:center; color:#94a3b8;">
          <div style="font-size:2rem; animation:spin 1s linear infinite; display:inline-block;">⏳</div>
          <div style="margin-top:10px; font-size:0.9rem;">Fetching schedule from email...</div>
        </div>`;
      meta.textContent = 'Searching mailbox...';

      try {
        const data = await callApi('getScheduleFile', {});
        if (data && data.found) {
          scheduleDataCache = data;
          renderScheduleContent(data);
        } else {
          renderSyncFailure(body, data);
          meta.textContent = 'No attachment found.';
        }
      } catch (err) {
        body.innerHTML = `<div style="text-align:center; color:#ef4444; padding:30px;">
          <div style="font-size:1rem; font-weight:700;">Error loading schedule</div>
          <div style="font-size:0.82rem; color:#94a3b8; margin-top:6px;">${err.message}</div>
        </div>`;
        meta.textContent = 'Error fetching file.';
      }
    }

    function renderSyncFailure(container, data) {
      container.innerHTML = `
        <div style="text-align:center; color:#ef4444; padding:10px;">
          <div style="font-size:2.5rem; margin-bottom:12px;">📭</div>
          <div style="font-size:1.05rem; font-weight:700; color:#fca5a5;">No schedule found</div>
          <div style="font-size:0.82rem; color:#94a3b8; margin:8px auto 16px auto; max-width:320px; line-height:1.4;">
            No PDF or image attachment was found in the Lawrence Anesthesia email group in the last 7 days.
          </div>
          <button onclick="resyncScheduleEmail()" style="background:linear-gradient(135deg,#667eea,#764ba2); border:none; border-radius:8px; color:#fff; font-size:0.85rem; font-weight:700; padding:8px 18px; cursor:pointer; margin-bottom:16px;">
            🔄 Try Re-sync
          </button>
          
          <details style="margin-top: 10px; text-align: left; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.06); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.72rem; max-height: 160px; overflow-y: auto;">
            <summary style="cursor: pointer; color: #a5b4fc; font-weight: 700; outline: none; margin-bottom: 6px; user-select:none;">🛠️ View Sync Debug Log</summary>
            <pre style="white-space: pre-wrap; margin: 0; color: #cbd5e1; background: transparent; border: none; padding: 0; font-family: inherit;">${data && data.log ? data.log : 'No debug log available. Click Re-sync to generate.'}</pre>
          </details>
        </div>`;
    }

    function renderScheduleContent(data) {
      const body = document.getElementById('schedule-modal-body');
      const meta = document.getElementById('schedule-modal-meta');
      meta.textContent = data.emailDate ? `From email on: ${data.emailDate}` : 'Schedule loaded';

      const dataUri = `data:${data.mimeType};base64,${data.base64}`;
      const mime = (data.mimeType || '').toLowerCase();

      if (mime === 'application/pdf') {
        // PDF: try embed, graceful fallback to download link for mobile
        body.innerHTML = `
          <div style="width:100%; text-align:center;">
            <embed src="${dataUri}" type="application/pdf"
              style="width:100%; min-height:72vh; border-radius:10px; border:1px solid rgba(255,255,255,0.08);"
              onerror="this.style.display='none'; document.getElementById('pdf-fallback-tk').style.display='block';"/>
            <div id="pdf-fallback-tk" style="display:none; padding:20px;">
              <p style="color:#94a3b8; font-size:0.9rem; margin-bottom:12px;">Your browser can't display the PDF inline. Open or download it below:</p>
              <a href="${dataUri}" download="${data.fileName || 'schedule.pdf'}" target="_blank"
                style="background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; text-decoration:none; padding:10px 22px; border-radius:10px; font-weight:700; font-size:0.9rem;">
                ⬇️ Download / Open PDF
              </a>
            </div>
          </div>`;
      } else if (mime.startsWith('image/')) {
        // Image: zoomable full-width
        body.innerHTML = `
          <div style="width:100%; text-align:center; cursor:zoom-in;" onclick="toggleImgZoom(this)">
            <img src="${dataUri}" alt="Daily Schedule"
              style="max-width:100%; border-radius:10px; border:1px solid rgba(255,255,255,0.08); transition:transform 0.25s ease;"
              title="Click to zoom" />
            <div style="font-size:0.72rem; color:#64748b; margin-top:8px;">Tap image to zoom in/out</div>
          </div>`;
      } else {
        body.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:20px;">
          <div style="font-size:0.9rem;">Unsupported file type: ${data.mimeType}</div>
          <a href="${dataUri}" download="${data.fileName || 'schedule'}" style="margin-top:10px; display:inline-block; color:#a5b4fc;">⬇️ Download</a>
        </div>`;
      }
    }

    function toggleImgZoom(wrapper) {
      const img = wrapper.querySelector('img');
      if (!img) return;
      const isZoomed = img.style.transform && img.style.transform !== 'none';
      img.style.transform = isZoomed ? 'none' : 'scale(1.85)';
      img.style.transformOrigin = 'top center';
      wrapper.style.cursor = isZoomed ? 'zoom-in' : 'zoom-out';
      wrapper.style.overflow = isZoomed ? 'visible' : 'hidden';
    }

    function closeScheduleModal() {
      document.getElementById('schedule-modal').style.display = 'none';
      document.body.style.overflow = '';
    }

    async function resyncScheduleEmail() {
      const body = document.getElementById('schedule-modal-body');
      const meta = document.getElementById('schedule-modal-meta');
      const btn = document.getElementById('btn-schedule-resync');
      scheduleDataCache = null;
      if (btn) btn.disabled = true;
      body.innerHTML = `
        <div style="text-align:center; color:#94a3b8;">
          <div style="font-size:2rem; animation:spin 1s linear infinite; display:inline-block;">⏳</div>
          <div style="margin-top:10px; font-size:0.9rem;">Scanning mailbox for latest schedule...</div>
        </div>`;
      meta.textContent = 'Re-syncing...';
      try {
        const syncRes = await callApi('syncScheduleEmail', {});
        const data = await callApi('getScheduleFile', {});
        if (data && data.found) {
          scheduleDataCache = data;
          renderScheduleContent(data);
          showToast('Schedule updated!', 'success');
        } else {
          // If getScheduleFile didn't get a log but syncRes did, merge them
          const displayData = data || {};
          if (syncRes && syncRes.log) displayData.log = syncRes.log;
          renderSyncFailure(body, displayData);
          meta.textContent = 'No attachment found.';
        }
      } catch (err) {
        meta.textContent = 'Sync failed.';
        showToast('Re-sync failed: ' + err.message);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    // Close modal on backdrop click
    document.getElementById('schedule-modal').addEventListener('click', function(e) {
      if (e.target === this) closeScheduleModal();
    });
  </script>
<!-- ============================================================
     SCHEDULE EMAIL VIEWER MODAL
     ============================================================ -->
<div id="schedule-modal" style="display:none; position:fixed; inset:0; z-index:9000; background:rgba(10,10,20,0.82); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); overflow-y:auto;">
  <div style="min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:20px 12px;">
    <div style="background:#1e1e2e; border:1px solid rgba(255,255,255,0.1); border-radius:18px; width:100%; max-width:820px; box-shadow:0 24px 80px rgba(0,0,0,0.7); overflow:hidden;">

      <!-- Modal Header -->
      <div style="padding:18px 22px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.08);">
        <div>
          <div style="font-weight:800; font-size:1.1rem; color:#e2e8f0; letter-spacing:-0.02em;">📄 Email Schedule</div>
          <div id="schedule-modal-meta" style="font-size:0.78rem; color:#94a3b8; margin-top:3px;">Searching for latest attachment...</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button id="btn-schedule-resync" onclick="resyncScheduleEmail()" title="Re-scan inbox for latest attachment" style="background:rgba(102,126,234,0.18); border:1px solid rgba(102,126,234,0.35); border-radius:8px; color:#a5b4fc; font-size:0.8rem; font-weight:700; padding:6px 12px; cursor:pointer; transition:all 0.2s;">
            🔄 Re-sync
          </button>
          <button onclick="closeScheduleModal()" style="background:rgba(255,255,255,0.08); border:none; border-radius:8px; color:#94a3b8; font-size:1.3rem; width:36px; height:36px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.2s;" title="Close">&times;</button>
        </div>
      </div>

      <!-- Modal Body -->
      <div id="schedule-modal-body" style="padding:20px; min-height:280px; display:flex; align-items:center; justify-content:center;">
        <div style="text-align:center; color:#64748b;">
          <div style="font-size:2.5rem; margin-bottom:12px;">📂</div>
          <div style="font-size:0.9rem;">No schedule loaded yet.</div>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
