<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Snapshot (Viewer)</title>
  
  <!-- Bulma and Custom Premium Stylesheet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="css/style.css?v=25">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest_snapshot.json?v=4">




  <!-- iOS PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Anaesthesia">
  <meta name="theme-color" content="#3273dc">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="snoozle.png">
  <link rel="icon" type="image/png" sizes="192x192" href="snoozle.png">
  <link rel="apple-touch-icon" sizes="180x180" href="snoozle.png">
</head>

<body>
  <div class="container mt-4">
    <div class="mb-4 is-flex is-justify-content-center">
      <div class="is-size-7 has-text-grey-light">
        Last updated: <span id="timestamp-display">Loading...</span>
      </div>
    </div>

    <!-- Date selector container -->
    <div id="date-selector-container" class="mb-5 is-flex is-justify-content-center is-align-items-center" style="display: flex; gap: 10px; flex-wrap: wrap;">
      <label class="label mb-0" for="entry-date-picker" style="font-size: 0.95rem; font-weight: 700; color: var(--text-main);">Select Date:</label>
      <div class="control">
        <input class="input is-small" type="date" id="entry-date-picker" style="max-width: 160px; font-weight: 600; background-color: #ffffff !important; color: #0f172a !important; color-scheme: light;">
      </div>
      <button class="button is-small is-light" id="btn-force-refresh" onclick="forceRefreshSchedule()" title="Force refresh schedule from Google Sheets" style="height: 28px; border-radius: 8px; font-size: 0.85rem; padding: 0 10px;">
        🔄 Refresh
      </button>
      <button class="button is-small is-link" id="btn-open-timecard" onclick="openTimecard()" title="Open Personal Timecard" style="height: 28px; border-radius: 8px; font-size: 0.85rem; padding: 0 10px; font-weight: 700;">
        🕰️ My Timecard
      </button>
    </div>

    <!-- Main Content Area -->
    <div id="content" class="snapshot-page">
      <div class="loading-wrap">
        <button class="button is-loading is-white is-large"></button>
        <p>Analyzing schedules and mapping physicians...</p>
      </div>
    </div>
  </div>

  <!-- Timecard Auth Modal -->
  <div id="timecard-auth-modal" class="modal">
    <div class="modal-background" onclick="closeTimecardAuthModal()"></div>
    <div class="modal-card" style="max-width: 400px; width: 90%; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);">
      <header class="modal-card-head" style="background: var(--card-bg); border-bottom: 1px solid var(--border-color);">
        <p class="modal-card-title has-text-weight-bold" style="font-size: 1.25rem; color: var(--text-main) !important;">🕰️ Timecard Portal</p>
        <button class="delete" aria-label="close" onclick="closeTimecardAuthModal()"></button>
      </header>
      <section class="modal-card-body" style="background: var(--bg-gradient); padding: 24px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
        <div class="field mb-4">
          <label class="label">Select Your Name</label>
          <div class="control select is-fullwidth">
            <select id="tc-name-select" style="background-color: #ffffff !important; color: #0f172a !important;">
              <option>Loading employees...</option>
            </select>
          </div>
        </div>
        
        <div class="field mb-5">
          <label class="label" id="tc-pin-label">Enter PIN</label>
          <div class="control">
            <input class="input" type="password" id="tc-pin-input" placeholder="####" pattern="\d*">
          </div>
        </div>

        <button class="button is-link is-fullwidth" id="tc-login-btn" onclick="submitTimecardLogin()">Access Timecard</button>
        <p id="tc-login-error" class="has-text-danger is-size-7 mt-2" style="display:none;"></p>
      </section>
    </div>
  </div>

  <!-- Timecard Dashboard Modal -->
  <div id="timecard-dashboard-modal" class="modal">
    <div class="modal-background" onclick="closeTimecardDashboardModal()"></div>
    <div class="modal-card" style="max-width: 500px; width: 92%; margin: 0 auto; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);">
      <header class="modal-card-head" style="background: var(--card-bg); border-bottom: 1px solid var(--border-color);">
        <p id="tc-dash-title" class="modal-card-title has-text-weight-bold" style="font-size: 1.25rem; color: var(--text-main) !important;">TIMECARD</p>
        <button class="delete" aria-label="close" onclick="closeTimecardDashboardModal()"></button>
      </header>
      <section class="modal-card-body" style="background: var(--bg-gradient); padding: 24px; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
        
        <!-- Sheet Linking UI -->
        <div id="tc-link-section" style="display:none;" class="mb-5">
          <div class="notification is-warning is-light p-3 is-size-7" style="border-radius: 8px;">
            <strong>⚠️ No Spreadsheet Linked:</strong> Please link your personal Google Sheet to enable clocking and reports from the portal.
          </div>
          <div class="field mb-3">
            <label class="label is-small">Google Sheet URL or ID</label>
            <div class="control">
              <input class="input is-small" type="text" id="tc-sheet-url-input" placeholder="Paste Google Sheet share link here...">
            </div>
          </div>
          <button class="button is-small is-link is-fullwidth" id="tc-link-btn" onclick="submitTimecardLink()">Link Spreadsheet</button>
          <p id="tc-link-error" class="has-text-danger is-size-7 mt-2" style="display:none;"></p>
        </div>

        <!-- Dashboard UI -->
        <div id="tc-main-section" style="display:none;">
          <!-- Live Clock Punch Status -->
          <div class="box has-text-centered p-4 mb-4" style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: none;">
            <div class="is-size-7 has-text-grey-light uppercase" style="letter-spacing: 0.05em; font-weight: 600;">Current Status</div>
            <div id="tc-clock-status-text" class="is-size-2 has-text-weight-bold my-2" style="color: var(--accent-rose);">CLOCKED OUT</div>
            <div id="tc-last-punch-text" class="is-size-7 has-text-grey-light mb-3">Last punch: None</div>
            
            <div class="buttons is-centered mb-0" style="display: flex; gap: 10px; justify-content: center;">
              <button class="button is-medium is-success" id="tc-clock-in-btn" onclick="submitClockPunch('Begin Work')" style="font-weight:700; width:130px; border-radius:10px;">
                🟢 Clock In
              </button>
              <button class="button is-medium is-danger" id="tc-clock-out-btn" onclick="submitClockPunch('End Work')" style="font-weight:700; width:130px; border-radius:10px;">
                🔴 Clock Out
              </button>
            </div>
            
            <label class="checkbox is-size-7 has-text-grey-light mt-3" style="display: inline-flex; align-items: center; gap: 4px;">
              <input type="checkbox" id="tc-prn-checkbox"> Mark punch as PRN
            </label>
          </div>

          <!-- Timesheet Tools Section -->
          <div class="section-title" style="font-size: 0.95rem; margin-top: 25px; margin-bottom: 12px; border-bottom-width: 1px;">Timesheet Calculations</div>
          
          <div style="display: flex; flex-direction: column; gap: 12px;" class="mb-4">
            <!-- Build Overtime -->
            <div class="box p-3 mb-0" style="background: var(--card-bg); border: 1px solid var(--border-color); width: 100%; border-radius: 10px; box-shadow: none;">
              <label class="label is-size-7 mb-2">Build Overtime (Select Start Monday)</label>
              <div class="is-flex" style="gap:8px;">
                <input class="input is-small" type="date" id="tc-overtime-date-picker" style="max-width:180px;">
                <button class="button is-small is-link mb-0" id="tc-overtime-btn" onclick="submitBuildOvertime()" style="font-weight:700; flex-grow:1;">
                  Build Worksheet
                </button>
              </div>
            </div>
            
            <!-- Update PRN/Call -->
            <div class="box p-3 mb-0" style="background: var(--card-bg); border: 1px solid var(--border-color); width: 100%; border-radius: 10px; box-shadow: none;">
              <label class="label is-size-7 mb-2">Sync Schedule (PRN / Call Backup)</label>
              <div class="is-flex" style="gap:8px; align-items: center; flex-wrap: wrap;">
                <label class="checkbox is-size-7 mr-2" style="white-space:nowrap; display: inline-flex; align-items: center; gap: 4px;">
                  <input type="checkbox" id="tc-custom-range-toggle" onchange="toggleCustomRangeView()"> Custom Dates
                </label>
                <div id="tc-custom-range-inputs" style="display:none; gap:4px; align-items:center;">
                  <input class="input is-small" type="date" id="tc-prn-start-date" style="max-width:110px;">
                  <span class="is-size-7">-</span>
                  <input class="input is-small" type="date" id="tc-prn-end-date" style="max-width:110px;">
                </div>
                <button class="button is-small is-link mb-0" id="tc-prn-btn" onclick="submitUpdatePrnCall()" style="font-weight:700; flex-grow:1;">
                  Sync Shifts
                </button>
              </div>
            </div>

            <!-- Email Timecard -->
            <button class="button is-light is-fullwidth py-4 mb-0" id="tc-email-btn" onclick="submitEmailTimecard()" style="font-weight:700; border-radius:10px; height: auto;">
              📧 Email Timesheet to Bhanika
            </button>
          </div>
          
          <div class="has-text-centered mt-4">
            <button class="button is-small is-light" onclick="logoutTimecard()" style="font-size:0.75rem;">
              Logout / Disconnect
            </button>
          </div>
        </div>

      </section>
    </div>
  </div>

  <!-- Load Configuration & API Helper first -->
  <script src="config.js"></script>
  <script src="js/api.js"></script>

  <script>
    const currentPage = "snapshot";
    const IS_READ_ONLY = false;
    // Tracks row IDs that are mid-flight (awaiting API response) so the
    // background poll does not reset their visual state prematurely.
    const pendingRows = new Set();

    function showToast(message, type = 'danger') {
      let toast = document.getElementById('api-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'api-toast';
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.padding = '12px 24px';
        toast.style.borderRadius = '8px';
        toast.style.color = '#fff';
        toast.style.zIndex = '9999';
        toast.style.fontWeight = '600';
        toast.style.fontSize = '0.9rem';
        toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
        toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease, bottom 0.3s ease';
        document.body.appendChild(toast);
      }
      toast.style.backgroundColor = type === 'success' ? '#10b981' : '#ef4444';
      toast.innerText = message;
      toast.style.opacity = '1';
      toast.style.bottom = '30px';
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.bottom = '20px';
      }, 4000);
    }

    window.onload = () => {
      const picker = document.getElementById('entry-date-picker');
      const todayLocal = new Date();
      const yyyy = todayLocal.getFullYear();
      const mm = String(todayLocal.getMonth() + 1).padStart(2, '0');
      const dd = String(todayLocal.getDate()).padStart(2, '0');
      picker.value = `${yyyy}-${mm}-${dd}`;
      
      picker.onchange = () => {
        fetchFreshData(picker.value);
      };

      fetchFreshData(picker.value);
    };

    // Poll for updates every 30 seconds
    setInterval(pollSignOffs, 30000);

    async function pollSignOffs() {
      try {
        const picker = document.getElementById('entry-date-picker');
        const activeDate = picker ? picker.value : '';
        const update = await callApi("getSnapshotPollUpdate", { dateStr: activeDate });
        syncCheckboxes(update.signOffs, update.breakLunchStates);
      } catch (err) {
        console.error("Polling error:", err);
      }
    }

    function syncCheckboxes(liveSignOffs, breakLunchStates) {
      const signedOffKeys = new Map(liveSignOffs.map(s => [`${s.name}|${s.role}|${s.dateStr}`, s]));
      const blState = breakLunchStates || {};

      document.querySelectorAll('.entry').forEach(entryRow => {
        const content = entryRow.querySelector('.entry-content');
        if (!content) return;

        // Skip rows that have a pending API call in progress (unused in read-only but safe)
        if (pendingRows.has(entryRow.id)) return;

        const name = entryRow.dataset.name;
        const role = entryRow.dataset.role;
        const dateStr = entryRow.dataset.date;
        if (!name || !role || !dateStr) return;

        const key = `${name}|${role}|${dateStr}`;
        const data = signedOffKeys.get(key);
        const blKey = `${name}|${role}`;
        const bl = blState[blKey] || { break: false, lunch: false, ob: false };

        // Clear existing display spans across the whole row
        entryRow.querySelectorAll('.arrival-time-display, .departure-time-display').forEach(el => el.remove());

        if (data) {
          // Sync Arrival (IN)
          if (data.arrivalTime) {
            const span = document.createElement('span');
            span.className = 'arrival-time-display';
            span.innerHTML = '<span class="time-prefix">IN @ </span>';
            span.appendChild(document.createTextNode(data.arrivalTime));
            content.appendChild(span);
          }

          // Sync Departure (OUT)
          if (data.time) {
            const span = document.createElement('span');
            span.className = 'departure-time-display';
            span.innerHTML = '<span class="time-prefix">OUT @ </span>';
            span.appendChild(document.createTextNode(data.time));
            content.appendChild(span);
            content.classList.add('strikethrough');
          } else {
            content.classList.remove('strikethrough');
          }
        } else {
          content.classList.remove('strikethrough');
        }

        // Hide break/lunch buttons entirely if they are signed off (home)
        const blControls = entryRow.querySelector('.break-lunch-controls');
        if (data && data.time) {
          if (blControls) blControls.remove();
        } else {
          // If not home, ensure break/lunch buttons exist and have correct active states
          if (blControls) {
            const btnBreak = blControls.querySelector('.btn-break');
            const btnLunch = blControls.querySelector('.btn-lunch');
            if (btnBreak) btnBreak.classList.toggle('active', !!bl.break);
            if (btnLunch) btnLunch.classList.toggle('active', !!bl.lunch);

            const btnOb = blControls.querySelector('.btn-ob');
            if (btnOb) btnOb.classList.toggle('active', !!bl.ob);
          } else {
            // Re-render controls if they were removed but signoff got cleared
            const newControls = document.createElement('div');
            newControls.className = 'break-lunch-controls';
            if (role === 'MD Call') {
              newControls.innerHTML = `
                <button class="btn-ob ${bl.ob ? 'active' : ''}" onclick="toggleBreakLunch(this, '${name}', '${role}', '${dateStr}', 'ob')">
                  <span class="btn-icon">👶</span> <span class="btn-text">OB</span>
                </button>
              `;
            } else {
              newControls.innerHTML = `
                <button class="btn-break ${bl.break ? 'active' : ''}" onclick="toggleBreakLunch(this, '${name}', '${role}', '${dateStr}', 'break')">
                  <span class="btn-icon">☕</span> <span class="btn-text">Break</span>
                </button>
                <button class="btn-lunch ${bl.lunch ? 'active' : ''}" onclick="toggleBreakLunch(this, '${name}', '${role}', '${dateStr}', 'lunch')">
                  <span class="btn-icon">🥪</span> <span class="btn-text">Lunch</span>
                </button>
              `;
            }
            entryRow.appendChild(newControls);
          }
        }
      });
    }

    async function fetchFreshData(customDate) {
      document.getElementById('content').innerHTML = `
        <div class="loading-wrap">
          <button class="button is-loading is-white is-large"></button>
        </div>`;
      try {
        const data = await callApi("getDailySnapshotData", { customDateStr: customDate });
        const now = new Date();
        document.getElementById('timestamp-display').innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        render(data);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="notification is-danger">Error loading data: ${err.message}</div>`;
      }
    }

    async function forceRefreshSchedule() {
      const picker = document.getElementById('entry-date-picker');
      const dateVal = picker ? picker.value : '';
      
      const btn = document.getElementById('btn-force-refresh');
      if (btn) btn.classList.add('is-loading');
      
      document.getElementById('content').innerHTML = `
        <div class="loading-wrap">
          <button class="button is-loading is-white is-large"></button>
        </div>`;
      try {
        const data = await callApi("getDailySnapshotData", { customDateStr: dateVal, forceRefresh: true });
        const now = new Date();
        document.getElementById('timestamp-display').innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ", " + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        render(data);
        showToast("Schedule refreshed from Sheet!", "success");
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="notification is-danger">Error refreshing data: ${err.message}</div>`;
      } finally {
        if (btn) btn.classList.remove('is-loading');
      }
    }

    async function toggleBreakLunch(btn, name, role, dateStr, type) {
      const isChecked = !btn.classList.contains('active');
      btn.classList.add('is-loading');
      
      try {
        const res = await callApi("toggleBreakLunch", { name, role, dateStr, type, isChecked });
        btn.classList.remove('is-loading');
        if (res && res.success) {
          btn.classList.toggle('active', isChecked);
          showToast("Status updated successfully!", "success");
        } else {
          showToast("Error: " + (res.error || "failed to update status."));
        }
      } catch (err) {
        btn.classList.remove('is-loading');
        showToast("Action failed: " + err.message);
      }
    }

    function formatTimeForInput(timeStr) {
      if (!timeStr) return '';
      const [time, ampm] = timeStr.split(' ');
      let [h, m] = time.split(':');
      h = parseInt(h, 10);
      if (ampm === 'PM' && h !== 12) h += 12;
      if (ampm === 'AM' && h === 12) h = 0;
      return `${String(h).padStart(2, '0')}:${m}`;
    }

    async function toggleArrival(checkbox, name, role, dateStr, targetId) {
      const row = document.getElementById(targetId);
      const content = row.querySelector('.entry-content');
      const arrivalTimeWrapper = row.querySelector('.arrival-time-wrapper');
      const arrivalTimeInput = arrivalTimeWrapper ? arrivalTimeWrapper.querySelector('input[type="time"]') : null;
      const manualTime = (arrivalTimeInput && checkbox.checked) ? arrivalTimeInput.value : null;

      if (arrivalTimeWrapper) arrivalTimeWrapper.style.display = checkbox.checked ? 'none' : 'flex';

      pendingRows.add(targetId);
      try {
        const res = await callApi("toggleArrival", { name, role, dateStr, isChecked: checkbox.checked, manualTime });
        const existingArrivalDisplay = row.querySelector('.arrival-time-display');
        if (existingArrivalDisplay) existingArrivalDisplay.remove();

        if (res.status && res.timestamp) {
          const span = document.createElement('span');
          span.className = 'arrival-time-display';
          span.innerHTML = '<span class="time-prefix">IN @ </span>';
          span.appendChild(document.createTextNode(res.timestamp));
          
          const arrivalSwitch = row.querySelector('.arrival-switch');
          if (arrivalSwitch) {
            arrivalSwitch.before(span);
          } else {
            content.appendChild(span);
          }
        } else if (!res.status && arrivalTimeInput) {
          arrivalTimeInput.value = '';
          updateTimeDisplay(arrivalTimeInput);
        }
      } catch (err) {
        alert("Arrival action failed: " + err.message);
        checkbox.checked = !checkbox.checked;
        if (arrivalTimeWrapper) arrivalTimeWrapper.style.display = checkbox.checked ? 'none' : 'flex';
      } finally {
        pendingRows.delete(targetId);
      }
    }

    async function toggleDeparture(checkbox, name, role, dateStr, targetId) {
      const row = document.getElementById(targetId);
      const content = row.querySelector('.entry-content');
      const departureTimeWrapper = row.querySelector('.departure-time-wrapper');
      const departureTimeInput = departureTimeWrapper ? departureTimeWrapper.querySelector('input[type="time"]') : null;
      const manualTime = (departureTimeInput && checkbox.checked) ? departureTimeInput.value : null;

      content.classList.toggle('strikethrough', checkbox.checked);
      if (departureTimeWrapper) departureTimeWrapper.style.display = checkbox.checked ? 'none' : 'flex';

      pendingRows.add(targetId);
      try {
        const res = await callApi("toggleSignOff", { name, role, dateStr, isChecked: checkbox.checked, manualTime });
        const existingDepartureDisplay = row.querySelector('.departure-time-display');
        if (existingDepartureDisplay) existingDepartureDisplay.remove();

        if (res.status && res.timestamp) {
          const span = document.createElement('span');
          span.className = 'departure-time-display';
          span.innerHTML = '<span class="time-prefix">OUT @ </span>';
          span.appendChild(document.createTextNode(res.timestamp));
          
          const departureSwitch = checkbox.closest('.switch-container');
          if (departureSwitch) {
            departureSwitch.before(span);
          } else {
            content.appendChild(span);
          }

          if (res.arrivalTime) {
            const arrivalCb = row.querySelector('.arrival-checkbox');
            const arrivalTimeWrapper = row.querySelector('.arrival-time-wrapper');
            if (arrivalCb && !arrivalCb.checked) {
              arrivalCb.checked = true;
              if (arrivalTimeWrapper) arrivalTimeWrapper.style.display = 'none';
              
              const existingArrivalDisplay = row.querySelector('.arrival-time-display');
              if (existingArrivalDisplay) existingArrivalDisplay.remove();

              const aSpan = document.createElement('span');
              aSpan.className = 'arrival-time-display';
              aSpan.innerHTML = '<span class="time-prefix">IN @ </span>';
              aSpan.appendChild(document.createTextNode(res.arrivalTime));
              
              const arrivalSwitch = row.querySelector('.arrival-switch');
              if (arrivalSwitch) {
                arrivalSwitch.before(aSpan);
              } else {
                content.appendChild(aSpan);
              }
            }
          }
        } else if (!res.status && departureTimeInput) {
          departureTimeInput.value = '';
          updateTimeDisplay(departureTimeInput);
        }
      } catch (err) {
        alert("Departure action failed: " + err.message);
        checkbox.checked = !checkbox.checked;
        content.classList.toggle('strikethrough', checkbox.checked);
        if (departureTimeWrapper) departureTimeWrapper.style.display = checkbox.checked ? 'none' : 'flex';
      } finally {
        pendingRows.delete(targetId);
      }
    }

    function updateTimeDisplay(input) {
      if (!input) return;
      const wrapper = input.closest('.time-input-wrapper');
      if (input.value) {
        wrapper.classList.add('has-value');
      } else {
        wrapper.classList.remove('has-value');
      }
    }

    function forcePicker(el) {
      const input = el.querySelector('input[type="time"]');
      if (input && !input.value) {
        try {
          if (typeof input.showPicker === 'function') input.showPicker();
          else input.focus();
        } catch (e) {
          input.style.opacity = "1";
        }
      }
    }

    function render(data) {
      let html = '<div class="columns is-multiline">';
      data.forEach(day => {
        html += `<div class="column is-6-desktop is-12-tablet">${renderDay(day)}</div>`;
      });
      html += '</div>';
      document.getElementById('content').innerHTML = html;
    }

    function renderDay(day) {
      const isWeekend = day.viewType === "WEEKEND";
      const isToday = day.isEditable;
      const isEntry = (currentPage === "entry");
      const dateId = (day.dateStr || '').replace(/[^a-zA-Z0-9]/g, '');
      const blState = day.breakLunchStates || {};

      const getSignOff = (name, role) => {
        if (!day.signOffs) return null;
        return day.signOffs.find(s =>
          String(s.name) === String(name) && String(s.role) === String(role)
        );
      };

      let html = `
          <div class="day-section">
            <h1 class="title is-2 mb-2">${day.viewTitle}</h1>
            <div class="date-header">${day.dateStr}</div>

            <div class="section-title">LMH Coverage</div>
            <div class="mb-5">
              <div class="entry" id="row-${dateId}-ac" data-name="${day.docs.ac}" data-role="MD Call" data-date="${day.dateStr}">
                <div class="entry-content">
                  <span class="num-badge" style="background-color: #48c78e;">MD CALL</span>
                  <span class="has-text-weight-bold">${day.docs.ac}</span>
                </div>
                <div class="break-lunch-controls">
                  <button class="btn-ob ${blState[`${day.docs.ac}|MD Call`]?.ob ? 'active' : ''}" onclick="toggleBreakLunch(this, '${day.docs.ac}', 'MD Call', '${day.dateStr}', 'ob')">
                    <span class="btn-icon">👶</span> <span class="btn-text">OB</span>
                  </button>
                </div>
              </div>
              ${!isWeekend ? `
              <div class="entry" id="row-${dateId}-pc">
                <div class="entry-content">
                  <span class="num-badge" style="background-color: #48c78e;">PAIN</span>
                  <span class="has-text-weight-bold">${day.docs.pc}</span>
                </div>
              </div>` : ''}
              <div class="entry" id="row-${dateId}-backup">
                <div class="entry-content">
                  <span class="num-badge">CRNA BACKUP</span>
                  <span class="has-text-weight-bold">${day.backupCRNA}</span>
                </div>
              </div>
            </div>`;

      if (!isWeekend) {
        html += `
            <div class="section-title">
              LSC
              <div class="break-lunch-header-labels-text">
                <span>Break</span>
                <span>Lunch</span>
              </div>
            </div>
            <div class="mb-5">
              <div class="entry" id="row-${dateId}-lscdoc" data-name="${day.docs.lsc}" data-role="LSC Doc" data-date="${day.dateStr}">
                <div class="entry-content">
                  <span class="num-badge" style="background-color: #48c78e;">DOC</span>
                  <span class="has-text-weight-bold">${day.docs.lsc}</span>
                </div>
                <div class="break-lunch-controls">
                  <button class="btn-break ${blState[`${day.docs.lsc}|LSC Doc`]?.break ? 'active' : ''}" onclick="toggleBreakLunch(this, '${day.docs.lsc}', 'LSC Doc', '${day.dateStr}', 'break')">
                    <span class="btn-icon">☕</span> <span class="btn-text">Break</span>
                  </button>
                  <button class="btn-lunch ${blState[`${day.docs.lsc}|LSC Doc`]?.lunch ? 'active' : ''}" onclick="toggleBreakLunch(this, '${day.docs.lsc}', 'LSC Doc', '${day.dateStr}', 'lunch')">
                    <span class="btn-icon">🥪</span> <span class="btn-text">Lunch</span>
                  </button>
                </div>
              </div>
              ${(() => {
                // Client-side Nancy rule: only show her in LSC if she appears as "Nancy (1500)".
                // If the API sends plain "Nancy" (e.g. cell says "holiday"), she is excluded.
                const filteredLsc = day.lsc.filter(name => {
                  if (name.toLowerCase().includes('nancy')) {
                    return name.includes('(1500)');
                  }
                  return true;
                });
                return filteredLsc.length ? filteredLsc.map((name, i) => {
                  const off = getSignOff(name, 'LSC');
                  const bl = blState[`${name}|LSC`] || { break: false, lunch: false };
                  const isHome = !!(off && off.time);
                  return `
                  <div class="entry" id="row-${dateId}-lsc-${i}" data-name="${name}" data-role="LSC" data-date="${day.dateStr}">
                    <div class="entry-content ${off && off.time ? 'strikethrough' : ''}">
                      <span class="num-badge">CRNA</span>
                      <span class="has-text-weight-bold">${name}</span>
                      ${(off && off.arrivalTime) ? `<span class="arrival-time-display"><span class="time-prefix">IN @ </span>${off.arrivalTime}</span>` : ''}
                      ${(off && off.time) ? `<span class="departure-time-display"><span class="time-prefix">OUT @ </span>${off.time}</span>` : ''}
                    </div>
                    ${!isHome ? `
                    <div class="break-lunch-controls">
                      <button class="btn-break ${bl.break ? 'active' : ''}" onclick="toggleBreakLunch(this, '${name}', 'LSC', '${day.dateStr}', 'break')">
                        <span class="btn-icon">☕</span> <span class="btn-text">Break</span>
                      </button>
                      <button class="btn-lunch ${bl.lunch ? 'active' : ''}" onclick="toggleBreakLunch(this, '${name}', 'LSC', '${day.dateStr}', 'lunch')">
                        <span class="btn-icon">🥪</span> <span class="btn-text">Lunch</span>
                      </button>
                    </div>` : ''}
                  </div>`;
                }).join('') : '<p class="italic-grey py-2">No LSC staff assigned</p>';
              })()}


            </div>

            <div class="section-title">
              CRNA Coverage
            </div>
            <div>
              ${(() => {
                // Filter out MD Locum rows where the cell value is a non-assignment word
                // (e.g. "Holiday", "Vacation") — the backend doesn't catch these.
                const NON_ASSIGNMENTS = ['holiday', 'vacation', 'sick', 'pto', 'leave', 'closed'];
                const filteredNumbered = day.numbered.filter(e => {
                  if (e.num === 'MD Locum') {
                    return !NON_ASSIGNMENTS.includes(e.name.toLowerCase().trim());
                  }
                  return true;
                });
                return filteredNumbered;
              })().map((e, i) => {
                const off = getSignOff(e.name, e.num);
                const bl = blState[`${e.name}|${e.num}`] || { break: false, lunch: false };
                const isHome = !!(off && off.time);
                return `
                <div class="entry" id="row-${dateId}-num-${i}" data-name="${e.name}" data-role="${e.num}" data-date="${day.dateStr}">
                  <div class="entry-content ${off && off.time ? 'strikethrough' : ''}">
                    <span class="num-badge">${e.num}</span>
                    <span class="has-text-weight-bold">${e.name}</span>
                    ${(off && off.arrivalTime) ? `<span class="arrival-time-display"><span class="time-prefix">IN @ </span>${off.arrivalTime}</span>` : ''}
                    ${(off && off.time) ? `<span class="departure-time-display"><span class="time-prefix">OUT @ </span>${off.time}</span>` : ''}
                  </div>
                  ${!isHome ? `
                  <div class="break-lunch-controls">
                    <button class="btn-break ${bl.break ? 'active' : ''}" onclick="toggleBreakLunch(this, '${e.name}', '${e.num}', '${day.dateStr}', 'break')">
                      <span class="btn-icon">☕</span> <span class="btn-text">Break</span>
                    </button>
                    <button class="btn-lunch ${bl.lunch ? 'active' : ''}" onclick="toggleBreakLunch(this, '${e.name}', '${e.num}', '${day.dateStr}', 'lunch')">
                      <span class="btn-icon">🥪</span> <span class="btn-text">Lunch</span>
                    </button>
                  </div>` : ''}
                 </div>`}).join('')}
              ${(() => {
                const NON_ASSIGNMENTS = ['holiday', 'vacation', 'sick', 'pto', 'leave', 'closed'];
                const filteredNumbered = day.numbered.filter(e => e.num !== 'MD Locum' || !NON_ASSIGNMENTS.includes(e.name.toLowerCase().trim()));
                return filteredNumbered.length === 0 ? '<p class="italic-grey py-2">No numbered shifts assigned</p>' : '';
              })()}

            </div>`;
      }

      html += `</div>`;
      return html;
    }

    /* ============================================================================
       TIMECARD FRONTEND PORTAL (OPTION 3)
       ============================================================================ */
    
    function openTimecard() {
      const storedName = localStorage.getItem("tc_name");
      const storedPin = localStorage.getItem("tc_pin");
      
      if (storedName && storedPin) {
        showTimecardDashboard(storedName, storedPin);
      } else {
        showTimecardAuth();
      }
    }

    async function showTimecardAuth() {
      const modal = document.getElementById("timecard-auth-modal");
      modal.classList.add("is-active");
      
      const select = document.getElementById("tc-name-select");
      select.innerHTML = "<option>Loading employees...</option>";
      
      try {
        const list = await callApi("getEmployeeNames");
        select.innerHTML = list.map(emp => 
          `<option value="${emp.name}">${emp.name}</option>`
        ).join('');
      } catch (err) {
        select.innerHTML = "<option>Error loading employees</option>";
        console.error("Failed to load names:", err);
      }
    }

    function closeTimecardAuthModal() {
      document.getElementById("timecard-auth-modal").classList.remove("is-active");
    }

    function closeTimecardDashboardModal() {
      document.getElementById("timecard-dashboard-modal").classList.remove("is-active");
    }

    async function submitTimecardLogin() {
      const name = document.getElementById("tc-name-select").value;
      const pin = document.getElementById("tc-pin-input").value;
      const btn = document.getElementById("tc-login-btn");
      const err = document.getElementById("tc-login-error");
      
      if (!pin) {
        alert("Please enter your PIN");
        return;
      }
      
      btn.classList.add("is-loading");
      err.style.display = "none";
      
      try {
        const res = await callApi("timecardLogin", { name, pin });
        localStorage.setItem("tc_name", name);
        localStorage.setItem("tc_pin", pin);
        if (res.sheetId) {
          localStorage.setItem("tc_sheet_id", res.sheetId);
        }
        
        closeTimecardAuthModal();
        btn.classList.remove("is-loading");
        document.getElementById("tc-pin-input").value = "";
        
        showTimecardDashboard(name, pin, res);
      } catch (e) {
        btn.classList.remove("is-loading");
        err.innerText = e.message;
        err.style.display = "block";
      }
    }

    async function showTimecardDashboard(name, pin, preloadedRes = null) {
      const dashModal = document.getElementById("timecard-dashboard-modal");
      dashModal.classList.add("is-active");
      
      document.getElementById("tc-dash-title").innerText = `TIMECARD: ${name.toUpperCase()}`;
      
      let res = preloadedRes;
      if (!res) {
        try {
          res = await callApi("timecardLogin", { name, pin });
          if (res.sheetId) {
            localStorage.setItem("tc_sheet_id", res.sheetId);
          }
        } catch (e) {
          logoutTimecard();
          alert("Session expired. Please log in again. Error: " + e.message);
          return;
        }
      }
      
      if (res.hasSheetLinked) {
        document.getElementById("tc-link-section").style.display = "none";
        document.getElementById("tc-main-section").style.display = "block";
        
        const otPicker = document.getElementById("tc-overtime-date-picker");
        if (!otPicker.value) {
          const d = new Date();
          const day = d.getDay();
          const diff = d.getDate() - day + (day === 0 ? -6 : 1);
          const mon = new Date(d.setDate(diff));
          otPicker.value = mon.toISOString().split('T')[0];
        }
        
        const prnStart = document.getElementById("tc-prn-start-date");
        const prnEnd = document.getElementById("tc-prn-end-date");
        if (!prnStart.value || !prnEnd.value) {
          const today = new Date();
          const lastMonth = new Date(today.getFullYear(), today.getMonth() - 1, 24);
          const currentMonth = new Date(today.getFullYear(), today.getMonth(), 24);
          prnStart.value = lastMonth.toISOString().split('T')[0];
          prnEnd.value = currentMonth.toISOString().split('T')[0];
        }
        
        refreshClockStatus(res.sheetId);
      } else {
        document.getElementById("tc-link-section").style.display = "block";
        document.getElementById("tc-main-section").style.display = "none";
      }
    }

    async function submitTimecardLink() {
      const urlInput = document.getElementById("tc-sheet-url-input").value;
      const name = localStorage.getItem("tc_name");
      const pin = localStorage.getItem("tc_pin");
      const btn = document.getElementById("tc-link-btn");
      const err = document.getElementById("tc-link-error");
      
      if (!urlInput) {
        alert("Please paste your spreadsheet URL or ID.");
        return;
      }
      
      btn.classList.add("is-loading");
      err.style.display = "none";
      
      try {
        const res = await callApi("timecardLinkSheet", { name, pin, sheetUrlOrId: urlInput });
        localStorage.setItem("tc_sheet_id", res.sheetId);
        btn.classList.remove("is-loading");
        document.getElementById("tc-sheet-url-input").value = "";
        
        showTimecardDashboard(name, pin);
        showToast("Spreadsheet linked successfully!", "success");
      } catch (e) {
        btn.classList.remove("is-loading");
        err.innerText = e.message;
        err.style.display = "block";
      }
    }

    async function refreshClockStatus(sheetId) {
      const statusText = document.getElementById("tc-clock-status-text");
      const punchText = document.getElementById("tc-last-punch-text");
      const clockInBtn = document.getElementById("tc-clock-in-btn");
      const clockOutBtn = document.getElementById("tc-clock-out-btn");
      
      statusText.innerText = "REFRESHING...";
      statusText.style.color = "var(--text-muted)";
      clockInBtn.disabled = true;
      clockOutBtn.disabled = true;
      
      try {
        const res = await callApi("timecardGetClockStatus", { sheetId });
        
        if (res.status === "IN") {
          statusText.innerText = "CLOCKED IN";
          statusText.style.color = "var(--accent-emerald)";
          clockInBtn.style.display = "none";
          clockOutBtn.style.display = "inline-flex";
        } else {
          statusText.innerText = "CLOCKED OUT";
          statusText.style.color = "var(--accent-rose)";
          clockInBtn.style.display = "inline-flex";
          clockOutBtn.style.display = "none";
        }
        
        punchText.innerText = res.lastPunch ? `Last punch: ${res.lastPunch}` : "Last punch: None";
      } catch (err) {
        statusText.innerText = "ERROR LOADING STATUS";
        statusText.style.color = "var(--accent-rose)";
        punchText.innerText = err.message;
        clockInBtn.style.display = "inline-flex";
        clockOutBtn.style.display = "none";
      } finally {
        clockInBtn.disabled = false;
        clockOutBtn.disabled = false;
      }
    }

    async function submitClockPunch(action) {
      const sheetId = localStorage.getItem("tc_sheet_id");
      const prnFlag = document.getElementById("tc-prn-checkbox").checked;
      
      const clockInBtn = document.getElementById("tc-clock-in-btn");
      const clockOutBtn = document.getElementById("tc-clock-out-btn");
      
      const targetBtn = (action === "Begin Work") ? clockInBtn : clockOutBtn;
      targetBtn.classList.add("is-loading");
      
      try {
        const res = await callApi("timecardClockPunch", { sheetId, punchAction: action, prnFlag });
        targetBtn.classList.remove("is-loading");
        
        document.getElementById("tc-prn-checkbox").checked = false;
        
        refreshClockStatus(sheetId);
        showToast(`Successfully punched: ${res.action} at ${res.timestamp}!`, "success");
      } catch (err) {
        targetBtn.classList.remove("is-loading");
        alert("Punch action failed: " + err.message);
      }
    }

    async function submitBuildOvertime() {
      const sheetId = localStorage.getItem("tc_sheet_id");
      const dateVal = document.getElementById("tc-overtime-date-picker").value;
      const btn = document.getElementById("tc-overtime-btn");
      
      if (!dateVal) {
        alert("Please select a starting Monday.");
        return;
      }
      
      btn.classList.add("is-loading");
      try {
        const dateObj = new Date(dateVal);
        await callApi("timecardBuildOvertime", { sheetId, startDateString: dateObj.toISOString() });
        btn.classList.remove("is-loading");
        showToast("Overtime worksheet built successfully!", "success");
      } catch (err) {
        btn.classList.remove("is-loading");
        alert("Build Overtime failed: " + err.message);
      }
    }

    function toggleCustomRangeView() {
      const toggle = document.getElementById("tc-custom-range-toggle");
      const inputs = document.getElementById("tc-custom-range-inputs");
      inputs.style.display = toggle.checked ? "inline-flex" : "none";
    }

    async function submitUpdatePrnCall() {
      const sheetId = localStorage.getItem("tc_sheet_id");
      const toggle = document.getElementById("tc-custom-range-toggle");
      const btn = document.getElementById("tc-prn-btn");
      
      let customStart = null;
      let customEnd = null;
      
      if (toggle.checked) {
        customStart = document.getElementById("tc-prn-start-date").value;
        customEnd = document.getElementById("tc-prn-end-date").value;
        if (!customStart || !customEnd) {
          alert("Please select start and end dates.");
          return;
        }
      }
      
      btn.classList.add("is-loading");
      try {
        const resultRange = await callApi("timecardUpdatePrnCall", { sheetId, customStart, customEnd });
        btn.classList.remove("is-loading");
        showToast(`Timesheet synced: ${resultRange}`, "success");
      } catch (err) {
        btn.classList.remove("is-loading");
        alert("Sync Shifts failed: " + err.message);
      }
    }

    async function submitEmailTimecard() {
      const sheetId = localStorage.getItem("tc_sheet_id");
      const btn = document.getElementById("tc-email-btn");
      
      if (!confirm("Are you sure you want to export and email your timesheet to Bhanika?")) {
        return;
      }
      
      btn.classList.add("is-loading");
      try {
        await callApi("timecardEmail", { sheetId });
        btn.classList.remove("is-loading");
        showToast("Timesheet emailed successfully!", "success");
      } catch (err) {
        btn.classList.remove("is-loading");
        alert("Failed to email timesheet: " + err.message);
      }
    }

    function logoutTimecard() {
      localStorage.removeItem("tc_name");
      localStorage.removeItem("tc_pin");
      localStorage.removeItem("tc_sheet_id");
      closeTimecardDashboardModal();
    }
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      // Auto-reload the page when a new service worker takes control (e.g. cache bump)
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          console.log('New service worker activated. Reloading...');
          window.location.reload();
        }
      });

      navigator.serviceWorker.getRegistrations().then(registrations => {
        const targetScope = new URL('./snapshot.html', window.location.href).href;
        let unregisteredOld = false;
        const promises = registrations.map(reg => {
          if (reg.scope !== targetScope) {
            console.log('Unregistering old or conflicting SW scope:', reg.scope);
            unregisteredOld = true;
            return reg.unregister();
          }
          return Promise.resolve(false);
        });
        Promise.all(promises).then(() => {
          navigator.serviceWorker.register('./sw.js', { scope: './snapshot.html' })
            .then(reg => {
              console.log('SW registered with scope:', reg.scope);
              if (unregisteredOld) {
                // Reload to let the new scoped service worker take control immediately
                window.location.reload();
              }
            })
            .catch(err => console.warn('SW registration failed:', err));
        });
      });
    }
  </script>
